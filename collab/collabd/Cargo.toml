[package]
name = "collabd"
description = "The collaboration sidecar: Commands on stdin, Events on stdout (suite-collab protocol), documents held in a Durable Streams store (Matrix is wired in a later pull request)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "collabd"
path = "src/lib.rs"

[[bin]]
name = "collabd"
path = "src/main.rs"

[dependencies]
# The one file both ends share (serde and serde_json only).
suite-collab = { path = "../../suite-collab" }
dcp-core = { path = "../dcp-core" }
dcp-streams = { path = "../dcp-streams" }
async-trait.workspace = true
hex.workspace = true
parking_lot = "0.13"
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "time", "sync"] }
