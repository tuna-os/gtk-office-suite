[package]
name = "dcp-streams"
description = "DCP draft-1 Durable Streams binding (spec 8.4 proposal), Spike B of RFC-0004: end-to-end encrypted, signed records over a byte-only HTTP log."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
dcp-core = { path = "../dcp-core" }
async-trait.workspace = true
base64.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util", "time", "sync"] }
getrandom = "0.3"
httpdate = "1"
# rustls with the ring provider and NO built-in trust roots (`rustls-tls-manual-roots`): the
# client trusts only the CA it is given (`http::Transport::ca_pem`). `http2` adds ALPN `h2`.
# Features pinned so the tree stays: rustls, hyper-rustls, tokio-rustls, rustls-webpki, ring, h2.
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls-manual-roots", "http2"] }
# The vetted RustCrypto primitives.
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.13"
zeroize = "1"

[dev-dependencies]
dcp-conformance = { path = "../dcp-conformance" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util", "macros", "time", "sync", "process"] }
# The transport tests speak TLS and HTTP/2 themselves (handshake timing, the server's SETTINGS,
# a request cut off mid-body); the same versions reqwest resolves, no other TLS stack.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
bytes = "1"
h2 = "0.4"
http = "1"
