[package]
name = "dcp-core"
description = "DCP draft-0 types, the DocumentStore trait, the rule logic and an in-memory reference store."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
parking_lot = "0.13"
# Only for `DocumentStore::wait_for_change`'s default (a sleep); `time` is in the workspace features.
tokio.workspace = true
# The schemas are local, so no HTTP retriever is wanted (and reqwest is heavy).
jsonschema = { version = "0.60", default-features = false }

[dev-dependencies]
tokio.workspace = true
