<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The visual matrix's only fonts (#1284): the bundled DejaVu Sans and
     DejaVu Sans Mono, and no system fonts at all, so a screenshot does not
     change when a machine's installed fonts do. Every family the apps ask
     for, Cantarell included, resolves to one of these two, and the
     rendering settings are fixed rather than left to the system's
     defaults. -->
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fontconfig-visual-matrix</cachedir>
  <match target="pattern">
    <test qual="any" name="family" compare="not_eq"><string>monospace</string></test>
    <test qual="any" name="family" compare="not_eq"><string>DejaVu Sans Mono</string></test>
    <test qual="any" name="family" compare="not_eq"><string>Monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
