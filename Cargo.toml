[workspace]
members = ["suite-common-core", "suite-common", "suite-export", "letters-core", "tables-core", "tables", "decks-core", "decks", "letters"]
resolver = "2"
# The CRDT measurement spike (RFC-0001 Phase 1) keeps its candidates out of
# the product lockfile.
exclude = ["tools/crdt-spike"]

[workspace.dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[patch.crates-io]
# Upstream fix for quick-xml RUSTSEC-2026-0194/0195 is merged but unreleased.
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }
