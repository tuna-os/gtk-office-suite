[workspace]
members = ["suite-common-core", "suite-common", "suite-export", "suite-collab", "suite-convert", "letters-core", "tables-core", "tables", "decks-core", "decks", "letters"]
resolver = "2"
# The CRDT measurement spike (RFC-0001 Phase 1) keeps its candidates out of
# the product lockfile.
# `lifafa` is the email client (AGPL-3.0-or-later; gtk4 0.9, which cannot share
# a lockfile with the suite's gtk4 0.11: gtk4-sys declares `links = "gtk-4"`).
# `mandelbrot` is the Matrix client (GPL-3.0-or-later): matrix-sdk, LiveKit and
# their dependency tree stay out of the suite's lockfile.
# `collab` is the collabd sidecar (RFC-0005 option B): its own workspace and
# lockfile, so matrix-sdk, rustls and tokio never reach this lockfile.
exclude = ["tools/crdt-spike", "tools/collab-spike", "collab", "lifafa", "mandelbrot"]

[workspace.dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }

# ironcalc_base is the one crate whose release build differed between two
# clean builds (#1671): the code was byte-identical, but the names ThinLTO
# gives the locals it promotes between its codegen units (`.llvm.<hash>`)
# took a different hash, so the symbol table and build-id did not match.
# As one codegen unit it has no locals to promote.
[profile.release.package.ironcalc_base]
codegen-units = 1

# Temporary security backports for collaboration (#1043); see third_party/README.md.
[patch.crates-io]
loro-internal = { path = "third_party/loro-internal" }
serde_columnar = { path = "third_party/serde_columnar" }
