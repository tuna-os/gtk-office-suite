[workspace]
members = ["suite-common-core", "suite-common", "suite-export", "suite-collab", "letters-core", "tables-core", "tables", "decks-core", "decks", "letters"]
resolver = "2"
# The CRDT measurement spike (RFC-0001 Phase 1) keeps its candidates out of
# the product lockfile.
# `collab` is the collabd sidecar (RFC-0005 option B): its own workspace and
# lockfile, so matrix-sdk, rustls and tokio never reach this lockfile.
exclude = ["tools/crdt-spike", "tools/collab-spike", "collab"]

[workspace.dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }

# ironcalc_base is the one crate whose release build differed between two
# clean builds (#1671): the code was byte-identical, but the names ThinLTO
# gives the locals it promotes between its codegen units (`.llvm.<hash>`)
# took a different hash, so the symbol table and build-id did not match.
# As one codegen unit it has no locals to promote.
[profile.release.package.ironcalc_base]
codegen-units = 1

# Published rdocx pins a vulnerable parser. Keep its released source family
# together while permitting pulldown-cmark >=0.13.6.
# Provenance and removal: docs/DEPENDENCIES.md.
[patch.crates-io]
rdocx = { git = "https://github.com/tuna-os/rdocx", rev = "0c3d3a03ce7be1ec02c0ad602c666d1a94f5b343" }
