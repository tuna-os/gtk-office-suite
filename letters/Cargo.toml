[package]
name = "letters"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.11", features = ["gnome_44", "v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
pulldown-cmark = "0.13"
cairo-rs = { version = "0.22", features = ["use_glib"] }
pango = "0.22"
pangocairo = "0.22"
zspell = { version = "0.5", features = ["unstable-suggestions"] }
suite-common = { path = "../suite-common" }
letters-core = { path = "../letters-core", features = ["render"] }
suite-export = { path = "../suite-export" }
serde_json = "1"
# Optional, feature `collab` (RFC-0005 P5): the wire protocol to the collabd
# sidecar. GTK-free, serde only; the shell links no network stack.
suite-collab = { path = "../suite-collab", optional = true }

[features]
# Live collaboration over Durable Streams (Collaborate menu, status button, two-heads
# banner). Off by default: a build without it has none of the code and no new permission.
collab = ["letters-core/collab", "dep:suite-collab"]

[[bin]]
name = "letters"
path = "src/main.rs"
