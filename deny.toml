# cargo-deny configuration (gtk-office-suite#269).
#
# The repository previously had no RustSec advisory gate: nothing consulted
# the advisory DB, so unmaintained/vulnerable crates were invisible rather
# than accepted. This file adds the gate. Known-vulnerable and yanked crates
# are denied; unmaintained/unsound notices are gated at 'all' scope EXCEPT
# the ones documented below as upstream-blocked (no patched release exists,
# and migration is upstream's call — see #269).

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # Font stack: ttf-parser and rustybuzz parse/shape font data embedded in
    # .docx/.pptx/.odt files (attacker-supplied binary input), but both are
    # unmaintained with no patched release; successors (skrifa/harfrust) are
    # only reachable through typst/usvg, so migration is upstream's call.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no patched release; reached via fontdb/oxml-layout/typst/usvg — upstream successor skrifa (see #269); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained, no patched release; reached via krilla/typst-layout/usvg — upstream successor harfrust (see #269); review by 2027-01-01" },
    # quick-xml 0.38.4: upstream-blocked, tracked in #225. Only quick-xml
    # >= 0.41 is patched (there is no 0.38.x fix), and typst -> hayagriva ->
    # citationberg 0.7.0 (the latest release) requires ^0.38.1, so Cargo.lock
    # holds 0.38.4 beside the workspace's fixed 0.41. Remove these two entries
    # once citationberg moves off 0.38; see the note in suite-export/Cargo.toml.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 via citationberg 0.7.0 (typst bibliography); no patched 0.38.x; our generated Typst never parses CSL (#225); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4 via citationberg 0.7.0 (typst bibliography); no patched 0.38.x; our generated Typst never parses CSL (#225); review by 2027-01-01" },
    # unsafe-libyaml: typst -> hayagriva 0.10.1 (the latest) -> serde_yaml,
    # which is deprecated and has no maintained release. It parses CSL/YAML
    # bibliographies, and our generated Typst never loads one (as for the
    # quick-xml entries above, #225).
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained via serde_yaml/hayagriva 0.10.1 (typst bibliography); no maintained release; our generated Typst never parses YAML bibliographies (#225); review by 2027-01-01" },
    # syntect (syntax highlighting) pulls both; not in the untrusted-input path.
    { id = "RUSTSEC-2025-0141", reason = "bincode development ceased, no patched release; via syntect — build/display only (#1197); review by 2027-01-01" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained, no patched release; via syntect — display only (#1197); review by 2027-01-01" },
    # Build-time proc-macro; does not ship in binaries.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained proc-macro; via biblatex/hayagriva/rav1e — build-time only (#1197); review by 2027-01-01" },
    # Loro (the `collab` feature of tables-core, RFC-0001 Phase 2, and of
    # decks-core, Phase 3; tracked in #1043) pulls these in.
    # The feature is off in every build that ships. This gate runs with
    # --all-features, which is the only reason it sees them. They must be
    # resolved before `collab` ships to users (RFC-0001 Phase 3), either
    # by a Loro release without `im` or by a fork.
    { id = "RUSTSEC-2023-0126", reason = "im OrdSet aliasing (unsound); via loro, collab feature only, not shipped — resolve before collab ships (#1043); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0248", reason = "im unmaintained; via loro, collab feature only, not shipped — resolve before collab ships (#1043); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks unmaintained; via im/loro, collab feature only, not shipped (#1043); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0255", reason = "sized-chunks panic-safety (unsound); via im/loro, collab feature only, not shipped — resolve before collab ships (#1043); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained; via im/loro, collab feature only, not shipped (#1043); review by 2027-01-01" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained; reached only with the collab feature's dependencies enabled (--all-features), not in shipped builds (#1043); review by 2027-01-01" },
    # zip: upstream yanked every 8.x from 8.5.0 on after 9.0 shipped, and
    # calamine 0.36.1 and rust_xlsxwriter 0.99.1 (both latest) still require
    # ^8.5, so Cargo.lock cannot leave 8.6.0. No advisory names it; remove
    # once those crates move to zip 9 (renovate #1537).
    { crate = "zip@8.6.0", reason = "yanked with no non-yanked 8.x left; calamine/rust_xlsxwriter latest still need ^8.5 — move to zip 9 with #1537; review by 2027-01-01" },
    # The three zip 8.6.0 advisories of October 2026 are all in archive
    # extraction to disk (`ZipArchive::extract`, `ZipStreamReader::extract`):
    # permission bits and symlink targets taken from the archive. Nothing
    # here calls either; calamine and rust_xlsxwriter read and write
    # entries only. Patched only in zip 9, which those crates do not take
    # yet: remove with the zip@8.6.0 entry above (#1537).
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 SUID/SGID bits kept by extract(); never called here or by calamine/rust_xlsxwriter; patched only in zip 9 (#1537); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 extract() symlink targets outside the destination; never called here or by calamine/rust_xlsxwriter; patched only in zip 9 (#1537); review by 2027-01-01" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 extract() permissions through symlinks; never called here or by calamine/rust_xlsxwriter; patched only in zip 9 (#1537); review by 2027-01-01" },
    # pulldown-cmark 0.13.4: rdocx (0.16.2 and the latest, 0.16.4) pins
    # `=0.13.4`, so the lock cannot take 0.13.5. The flaw needs
    # `Options::ENABLE_WIKILINKS` (or `Options::all()`); letters-core,
    # decks and rdocx enable only tables and strikethrough. Remove once
    # rdocx allows 0.13.5 (#1798).
    { id = "RUSTSEC-2026-0414", reason = "pulldown-cmark wikilink event growth needs ENABLE_WIKILINKS, which nothing here or in rdocx sets; rdocx pins =0.13.4 so 0.13.5 cannot be locked (#1798); review by 2027-01-01" },
    # collab/Cargo.lock, the collabd sidecar's own lock (RFC-0005 option B; the product's
    # lock is unaffected: `tests/test_collab_defaults.py`). `collab-apps.yml` runs this
    # gate on it. These are matched only when that lock is read; the product's `advisories`
    # job does not see the crates and does not need them.
    { id = "RUSTSEC-2026-0319", reason = "anymap2 unmaintained, no patched release; via matrix-sdk 0.19.1 (collab/Cargo.lock only; the Matrix binding is wired in a later pull request) — resolve with the Matrix binding (#1043); review by 2027-01-01" },
]
