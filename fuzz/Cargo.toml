[package]
name = "gtk-office-suite-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
letters-core = { path = "../letters-core" }
tables-core = { path = "../tables-core" }
decks-core = { path = "../decks-core" }
tempfile = "3"

[[bin]]
name = "letters_docx"
path = "fuzz_targets/letters_docx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tables_xlsx"
path = "fuzz_targets/tables_xlsx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decks_pptx"
path = "fuzz_targets/decks_pptx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "letters_odt"
path = "fuzz_targets/letters_odt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "letters_markdown"
path = "fuzz_targets/letters_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decks_odp"
path = "fuzz_targets/decks_odp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decks_master_shapes"
path = "fuzz_targets/decks_master_shapes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tables_ods"
path = "fuzz_targets/tables_ods.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tables_xlsx_parts"
path = "fuzz_targets/tables_xlsx_parts.rs"
test = false
doc = false
bench = false

[workspace]

# The root workspace's patches do not reach this separate workspace, so each
# one is mirrored here (tests/test_patched_dependencies.py keeps the two in
# step). Without the oxml-layout one the nightly fuzz build resolved the
# unpatched crate and failed with E0004 on `fontdb::Source::SharedFile`
# (#883, #936). See docs/DEPENDENCIES.md.
[patch.crates-io]
oxml-layout = { git = "https://github.com/tuna-os/rdocx", rev = "46d220426b635d64890d786959d272b2c210fad8" }
