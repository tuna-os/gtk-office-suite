<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The faces the shipped Flatpaks draw for families neither they nor this
  container have, so LibreOffice and Tier A here fall back as the app does
  for users (and in Tier C). Read from the GNOME 50 runtime's fc-match in
  the Tier C VM (tools/render-lab/vm/run.sh writes vm-work/fonts-<app>.log;
  render-parity run 45621842241): each of these goes to DejaVu Sans there.
  Without this the container drew them in Noto Sans, about 8% narrower, so
  a Verdana document wrapped differently in Tier C than in its reference
  (real statistical-release-october-to-december-2020). Segoe UI goes to
  Adwaita Sans in the runtime, which this container has no package for.
-->
<fontconfig>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Narrow</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Humnst777 Lt BT</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
