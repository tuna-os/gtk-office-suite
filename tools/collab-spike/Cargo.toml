# RFC-0004 spikes A (Matrix) and D (WOPI host adapter), and the shared
# conformance suite that runs them against each other. Not product crates.
#
# Deliberately NOT a member of the root workspace (see the root Cargo.toml's
# `exclude`): matrix-sdk and an HTTP stack must not reach the product crates
# or their lockfile, and the Flatpak `--locked` build must not change.
[workspace]
resolver = "2"
members = ["dcp-core", "dcp-conformance", "dcp-matrix", "dcp-wopi", "dcp-interop"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.23"
hex = "0.4"
jsonschema = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
