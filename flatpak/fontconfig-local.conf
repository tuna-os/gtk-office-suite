<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /app/etc/fonts/local.conf, which the runtime's fontconfig
  includes. The runtime carries no Verdana or Tahoma, so a document set in
  either fell to whatever the runtime's generic sans-serif is, a face of
  other widths: lines wrapped elsewhere than in LibreOffice on a typical
  Linux desktop, which draws both in DejaVu Sans (render lab Tier C,
  docs/KNOWN-GAPS.md). These name DejaVu Sans as their fallback.

  `accept` adds DejaVu Sans after the asked-for family rather than before
  it, so a real Verdana or Tahoma the host shares into the sandbox still
  wins.
-->
<fontconfig>
  <alias binding="same">
    <family>Verdana</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Tahoma</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>
</fontconfig>
