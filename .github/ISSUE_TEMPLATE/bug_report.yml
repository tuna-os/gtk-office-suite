name: Bug report
description: Something in Letters, Tables or Decks doesn't work as it should
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the bug is a security problem (for example a
        crafted file that crashes or takes over an app), don't file it here: see
        [SECURITY.md](https://github.com/tuna-os/gtk-office-suite/blob/main/SECURITY.md).
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Letters
        - Tables
        - Decks
        - More than one
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, from opening the app.
      placeholder: |
        1. Open the attached file
        2. Select the second paragraph
        3. Press Ctrl+B
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include any error message, and a screenshot if it's a display problem.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Document
      description: |
        If a particular file triggers it, attach it (or a cut-down copy without
        private content) and say which program made it. For rendering
        differences, a PDF of how LibreOffice shows the same file helps.
  - type: input
    id: version
    attributes:
      label: Version
      description: The Flatpak version (About dialog) or the commit you built from.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution, GNOME version, Wayland or X11, display scale.
      placeholder: Fedora 41, GNOME 47, Wayland, 200%
