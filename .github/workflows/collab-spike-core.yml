name: collab-spike-core

# RFC-0004 spike: dcp-core logic, the in-memory reference store and the
# conformance suite with its mutation tests. Not a product check.
on:
  push:
    branches: [spike/collab-core]
    paths:
      - 'tools/collab-spike/**'
      - 'docs/collab-spec/**'
      - '.github/workflows/collab-spike-core.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike
      - name: cargo test -p dcp-core -p dcp-conformance
        working-directory: tools/collab-spike
        run: cargo test -p dcp-core -p dcp-conformance -- --nocapture --test-threads=2
      - name: validate.py (the Rust negatives are kept in step with it)
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet jsonschema
          "$RUNNER_TEMP/v/bin/python" docs/collab-spec/validate.py
