name: Publish Flatpaks

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This file just keeps the repo's own
# trigger policy and fans the three apps out over the reusable workflow via
# a caller-side matrix -- `uses:` jobs support `strategy.matrix` same as any
# other job.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR and update the central index (leave off for a build-only validation run)
        type: boolean
        default: false

# Read-only by default. Only the `publish` job below gets write scopes; the
# evidence gate and the build-only dispatch path never needed them (#1007).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A tag used to publish Flatpaks regardless of what the evidence workflows
  # said: release-revision.yml and the stress campaign ran *beside* this one,
  # so a release the ledger refused to certify, and a revision nobody had
  # soaked, shipped anyway. #442 asks for a larger soak and the complete
  # matrix on the release candidate and for a release that lacks one to be
  # refused; a refusal that arrives after publication is neither.
  #
  # Both gates are skipped on a build-only workflow_dispatch, which publishes
  # nothing. A dispatch with `publish` runs them like a tag does: that is how
  # autorelease.yml publishes, since a tag pushed with GITHUB_TOKEN starts no
  # workflow of its own, and a manual publish must not bypass the gates.
  evidence:
    if: github.event_name == 'push' || inputs.publish
    uses: ./.github/workflows/release-revision.yml

  soak:
    if: github.event_name == 'push' || inputs.publish
    uses: ./.github/workflows/release-soak.yml
    permissions:
      contents: read
      packages: write

  publish:
    needs: [evidence, soak]
    # A *skipped* gate must not block the manual build-only path, but a
    # failed one must block the tag. `needs` alone would skip this job in
    # both cases, and `always()` would publish through a failure — so name
    # the two results explicitly. A publishing dispatch needs both to have
    # passed, not merely not failed.
    if: >-
      ${{ !cancelled()
          && needs.evidence.result != 'failure'
          && needs.soak.result != 'failure'
          && (github.event_name != 'workflow_dispatch' || !inputs.publish
              || (needs.evidence.result == 'success' && needs.soak.result == 'success')) }}
    strategy:
      matrix:
        app: [letters, tables, decks]
    # What the reusable workflow does with them: `contents: write` uploads
    # the bundles to the GitHub release, `packages: write` pushes the OCI
    # images to GHCR.
    permissions:
      contents: write
      packages: write
    # Pinned to a reviewed commit, not @main: a job holding write scopes
    # and the index token must not run whatever the shared branch holds at
    # publish time (#286, #1007). Renovate proposes digest bumps; review the
    # tuna-os/.github diff before merging one.
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@4078f531ac74703f203bde835ef6c25e9321b97b # main
    with:
      app-id: org.tunaos.${{ matrix.app }}
      manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
      repo-name: tuna-os/${{ matrix.app }}
      attach-bundles: true
      # Not `A && B || C`: if B (inputs.publish) is false that's falsy, so
      # `||` would fall through to C and publish anyway regardless of the
      # toggle (caught by testing on mariner, tuna-os/mariner#17).
      publish: ${{ (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    # Only the one secret the called workflow declares, not `inherit`
    # (every repository and organisation secret). GITHUB_TOKEN is passed
    # implicitly, limited by `permissions` above.
    secrets:
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}

  # The /app tree of each app as a tarball on the release, for remotes that
  # repackage the vendor's own download (FlatPark, extra-data) instead of
  # building from source. Built from the tag in the GNOME SDK, like the
  # bundles, so the published bytes match the tag they are filed under.
  # FlatPark's resolvers read `<app>-<arch>.tar.gz` from the latest release
  # and check `bin/<app>` inside it.
  tarballs:
    needs: [evidence, soak]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.evidence.result == 'success' && needs.soak.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build org.tunaos.${{ matrix.app }}
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          bundle: ${{ matrix.app }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache: false
          upload-artifact: false
      - name: Pack the /app tree
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          flatpak install --user -y --noninteractive --bundle "$APP-$ARCH.flatpak"
          files="$(flatpak info --user --show-location "org.tunaos.$APP")/files"
          [ -x "$files/bin/$APP" ] || { echo "::error::bin/$APP missing from the built app"; exit 1; }
          # Recorded owner 0: FlatPark's apply_extra unpacks as root with
          # every capability dropped, where restoring another uid fails.
          tar --owner=0 --group=0 --numeric-owner -C "$files" -czf "$APP-$ARCH.tar.gz" .
          sha256sum "$APP-$ARCH.tar.gz" | tee "$APP-$ARCH.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tarball-${{ matrix.app }}-${{ matrix.arch }}
          path: |
            ${{ matrix.app }}-${{ matrix.arch }}.tar.gz
            ${{ matrix.app }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  # autorelease.yml creates the release as a draft, so nothing reading
  # `releases/latest` sees it before its downloads are attached. This
  # attaches the tarballs and then publishes it, only once the Flatpaks
  # were published and every tarball was built.
  release:
    needs: [publish, tarballs]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.publish.result == 'success' && needs.tarballs.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tarball-*
          merge-multiple: true
      - name: Attach the tarballs and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" --clobber -R "$GITHUB_REPOSITORY" -- *.tar.gz *.tar.gz.sha256
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
