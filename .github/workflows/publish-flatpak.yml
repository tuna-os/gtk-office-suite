name: Publish Flatpaks

# Letters, Tables and Decks, built once per app and architecture behind the
# evidence and soak gates, pushed to ghcr.io/tuna-os/<app>, indexed in the
# TunaOS remote, and attached to the tag's release. It used to call
# tuna-os/.github's reusable publish-flatpak.yml once per app; that workflow
# is made for one app per run, and three in one run mixed their images up
# (see the `build` job). Mandelbrot, alone in its run, still uses it
# (publish-mandelbrot.yml); the central-index action is still the org's.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR and update the central index (leave off for a build-only validation run)
        type: boolean
        default: false

# Read-only by default. Only the `publish` job below gets write scopes; the
# evidence gate and the build-only dispatch path never needed them (#1007).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A tag used to publish Flatpaks regardless of what the evidence workflows
  # said: release-revision.yml and the stress campaign ran *beside* this one,
  # so a release the ledger refused to certify, and a revision nobody had
  # soaked, shipped anyway. #442 asks for a larger soak and the complete
  # matrix on the release candidate and for a release that lacks one to be
  # refused; a refusal that arrives after publication is neither.
  #
  # Both gates are skipped on a build-only workflow_dispatch, which publishes
  # nothing. A dispatch with `publish` runs them like a tag does: that is how
  # autorelease.yml publishes, since a tag pushed with GITHUB_TOKEN starts no
  # workflow of its own, and a manual publish must not bypass the gates.
  evidence:
    if: github.event_name == 'push' || inputs.publish
    uses: $/.github/workflows/release-revision.yml

  soak:
    if: github.event_name == 'push' || inputs.publish
    uses: $/.github/workflows/release-soak.yml
    permissions:
      contents: read
      packages: write

  # Each app, per architecture, built once from the tag in the GNOME SDK:
  # the OCI image the remote serves, the .flatpak bundle and the /app
  # tarball the release carries all come from this one build.
  #
  # Every artifact is named after its app *and* architecture. The org's
  # reusable publish-flatpak.yml, which this job and `publish` replace,
  # names them after the architecture only (oci-x86_64, bundle-x86_64).
  # Called once per app in one run, the three apps' artifacts shared those
  # names, and each app published whichever survived: ghcr.io/tuna-os/tables
  # held Decks for x86_64 in v2.1.62 and v2.1.63, letters held Decks in
  # v2.1.62, and Letters' and Tables' x86_64 bundles were missing from the
  # v2.1.63 release.
  #
  # A *skipped* gate must not block the manual build-only path, but a
  # failed one must block the tag. `needs` alone would skip this job in
  # both cases, and `always()` would build through a failure — so name the
  # two results explicitly. A publishing dispatch needs both to have
  # passed, not merely not failed.
  build:
    needs: [evidence, soak]
    if: >-
      ${{ !cancelled()
          && needs.evidence.result != 'failure'
          && needs.soak.result != 'failure'
          && (github.event_name != 'workflow_dispatch' || !inputs.publish
              || (needs.evidence.result == 'success' && needs.soak.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    permissions:
      contents: read
    env:
      APP: ${{ matrix.app }}
      APP_ID: org.tunaos.${{ matrix.app }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The image ships its SDK in /var/lib/flatpak, in the image's own
      # layers. When Flathub has a newer SDK, flatpak-builder updates it in
      # place, and on some runners' overlayfs that fails with "Invalid
      # cross-device link" before anything is built. A copy in the
      # container's writable layer updates normally.
      - name: Make the image's Flatpak installation writable
        run: |
          set -euo pipefail
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak

      - name: Build org.tunaos.${{ matrix.app }}
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          bundle: org.tunaos.${{ matrix.app }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache: false
          upload-artifact: false

      # The image the remote serves, from the same repository as the bundle.
      # Its org.flatpak.ref label is checked, so an image can never be filed
      # under another app's name again.
      - name: Export the OCI image
        run: |
          set -euo pipefail
          flatpak build-bundle --oci --arch="$ARCH" repo "oci-$APP-$ARCH" "$APP_ID"
          test -s "oci-$APP-$ARCH/index.json"
          python3 tools/release/check_oci_ref.py "oci-$APP-$ARCH" "app/$APP_ID/$ARCH/"

      # The /app tree of each app as a tarball on the release, for remotes
      # that repackage the vendor's own download (FlatPark, extra-data)
      # instead of building from source. FlatPark's resolvers read
      # `<app>-<arch>.tar.gz` from the latest release and check `bin/<app>`
      # inside it.
      - name: Pack the /app tree
        run: |
          set -euo pipefail
          flatpak install --user -y --noninteractive --bundle "$APP_ID-$ARCH.flatpak"
          files="$(flatpak info --user --show-location "$APP_ID")/files"
          [ -x "$files/bin/$APP" ] || { echo "::error::bin/$APP missing from the built app"; exit 1; }
          # Recorded owner 0: FlatPark's apply_extra unpacks as root with
          # every capability dropped, where restoring another uid fails.
          tar --owner=0 --group=0 --numeric-owner -C "$files" -czf "$APP-$ARCH.tar.gz" .
          sha256sum "$APP-$ARCH.tar.gz" | tee "$APP-$ARCH.tar.gz.sha256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: oci-${{ matrix.app }}-${{ matrix.arch }}
          path: oci-${{ matrix.app }}-${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.app }}-${{ matrix.arch }}
          path: org.tunaos.${{ matrix.app }}-${{ matrix.arch }}.flatpak
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tarball-${{ matrix.app }}-${{ matrix.arch }}
          path: |
            ${{ matrix.app }}-${{ matrix.arch }}.tar.gz
            ${{ matrix.app }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  # Push each image to ghcr.io/tuna-os/<app> and update its entry in the
  # central index, as the reusable workflow did: `latest-<arch>`, the tag's
  # `<tag>-<arch>`, and `latest` following x86_64. Only a tag, or a dispatch
  # with `publish`, gets here; a build-only dispatch stops at `build`.
  publish:
    needs: [evidence, soak, build]
    if: >-
      ${{ !cancelled()
          && needs.evidence.result != 'failure'
          && needs.soak.result != 'failure'
          && (github.event_name != 'workflow_dispatch' || !inputs.publish
              || (needs.evidence.result == 'success' && needs.soak.result == 'success'))
          && needs.build.result == 'success'
          && (github.event_name == 'push' || inputs.publish) }}
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # GHCR push (skopeo login + copy)
    env:
      IMAGE: ghcr.io/tuna-os/${{ matrix.app }}
      APP: ${{ matrix.app }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The checker, from this run's revision; nothing from the build is run.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: oci-${{ matrix.app }}-${{ matrix.arch }}
          path: oci-${{ matrix.app }}-${{ matrix.arch }}
      - name: Check the image is this app's
        run: python3 tools/release/check_oci_ref.py "oci-$APP-$ARCH" "app/org.tunaos.$APP/$ARCH/"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          # Some runners' default container auth path is not writable.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push OCI to the registry
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          dir="oci-$APP-$ARCH"
          skopeo copy "oci:$dir" "docker://$IMAGE:latest-$ARCH"
          if [[ "$REF" == refs/tags/* ]]; then
            skopeo copy "oci:$dir" "docker://$IMAGE:$REF_NAME-$ARCH"
          fi
          if [ "$ARCH" = x86_64 ]; then
            skopeo copy "oci:$dir" "docker://$IMAGE:latest"
          fi

      # The reusable workflow's index action, from the reviewed commit of
      # tuna-os/.github that lifafa-flatpak.yml checks out (#286, #1007).
      # Checked out rather than named in `uses:`, so actions.lock pins it
      # through actions/checkout. Keep the two commits in step.
      - uses: actions/checkout@v7.0.1
        with:
          repository: tuna-os/.github
          ref: 4078f531ac74703f203bde835ef6c25e9321b97b
          path: tuna-os-github
          persist-credentials: false

      - name: Update the central index
        uses: ./tuna-os-github/.github/actions/publish-flatpak-index  # zizmor: ignore[self-repository] a checkout of tuna-os/.github, not this repository
        with:
          oci-dir: oci-${{ matrix.app }}-${{ matrix.arch }}
          repo-name: tuna-os/${{ matrix.app }}
          registry: ghcr.io
          tags: latest
          ssh-key: ${{ secrets.FLATPAK_INDEX_DEPLOY_KEY }}

  # autorelease.yml creates the release as a draft, so nothing reading
  # `releases/latest` sees it before its downloads are attached. This
  # attaches the bundles and tarballs and then publishes it, only once the
  # Flatpaks were published and every app was built.
  #
  # Publishing it with GITHUB_TOKEN raises no `release: published` event
  # (GitHub starts no workflow from that token's events), so
  # release-evidence.yml and overview-videos.yml, which wait for that event,
  # never ran for a release made this way, and v2.1.62 and v2.1.63 went out
  # without their evidence (#1209). A workflow_dispatch is the one event the
  # token may raise, so this dispatches both on the tag.
  release:
    needs: [publish, build]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.publish.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write   # dispatch the release's evidence and overview videos
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
      - name: Attach the bundles and tarballs and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every app and architecture, or none: a release missing one is
          # what the shared artifact names produced (v2.1.63).
          test "$(ls org.tunaos.*-*.flatpak | wc -l)" -eq 6
          test "$(ls ./*.tar.gz | wc -l)" -eq 6
          gh release upload "$GITHUB_REF_NAME" --clobber -R "$GITHUB_REPOSITORY" -- \
            org.tunaos.*.flatpak *.tar.gz *.tar.gz.sha256
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
      - name: Gather the release's evidence and overview videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-evidence.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f tag="$GITHUB_REF_NAME" -f attach=true
          gh workflow run overview-videos.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
