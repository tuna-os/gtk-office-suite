name: Publish Flatpaks

# Build the three apps as Flatpak OCI images for x86_64 and aarch64, push
# them to GHCR, and update the TunaOS Flatpak index (tunaos.org/flatpak) so
# `flatpak install tuna-os org.tunaos.<app>` serves current builds on
# either architecture.
# Also attaches installable .flatpak bundles to the triggering release.
#
# Each arch builds natively on its own runner rather than cross-building via
# QEMU -- Blacksmith runners don't come with binfmt_misc/qemu-user
# preregistered the way GitHub-hosted runners do, so bwrap inside the
# cross-arch build fails with "Exec format error".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-oci:
    name: Build OCI — ${{ matrix.app }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'blacksmith-4vcpu-ubuntu-2404-arm' || 'blacksmith-4vcpu-ubuntu-2404' }}
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
        arch: [x86_64, aarch64]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          cache-key: flatpak-publish-${{ matrix.app }}-${{ github.sha }}-${{ matrix.arch }}
          bundle: ${{ matrix.app }}-${{ matrix.arch }}.flatpak
          upload-artifact: false
          arch: ${{ matrix.arch }}

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=${{ matrix.arch }} repo ${{ matrix.app }}-${{ matrix.arch }}.oci org.tunaos.${{ matrix.app }}

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ matrix.arch }}-oci
          path: ${{ matrix.app }}-${{ matrix.arch }}.oci/
          retention-days: 1

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ matrix.arch }}-bundle
          path: ${{ matrix.app }}-${{ matrix.arch }}.flatpak
          retention-days: 7

  publish:
    name: Publish — ${{ matrix.app }}
    needs: build-oci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      # The index update is a git push to tuna-os/docs; serialize so the
      # three apps don't race each other.
      max-parallel: 1
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.app }}-x86_64-oci
          # upload-artifact flattens a single-directory `path` to the
          # artifact root, so both arches must download into distinct
          # subdirectories -- `path: .` for both put x86_64's and
          # aarch64's index.json/blobs in the same place, clobbering
          # each other.
          path: ${{ matrix.app }}-x86_64.oci

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.app }}-aarch64-oci
          path: ${{ matrix.app }}-aarch64.oci

      - name: Push OCI to GHCR
        env:
          # Blacksmith runners' default container auth path
          # (/run/containers/$UID/auth.json) isn't writable; point skopeo
          # at a location under RUNNER_TEMP instead.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy oci:${{ matrix.app }}-x86_64.oci docker://ghcr.io/tuna-os/${{ matrix.app }}:latest-x86_64
          skopeo copy oci:${{ matrix.app }}-aarch64.oci docker://ghcr.io/tuna-os/${{ matrix.app }}:latest-aarch64

      - name: Update central index (tuna-os/docs)
        env:
          FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${FLATPAK_INDEX_TOKEN}@github.com/tuna-os/docs.git \
            index-repo
          pip install requests
          python3 .github/scripts/update-index.py \
            --oci-dir ${{ matrix.app }}-x86_64.oci \
            --index-file index-repo/static/flatpak/index/static \
            --repo-name tuna-os/${{ matrix.app }} \
            --tags latest
          python3 .github/scripts/update-index.py \
            --oci-dir ${{ matrix.app }}-aarch64.oci \
            --index-file index-repo/static/flatpak/index/static \
            --repo-name tuna-os/${{ matrix.app }} \
            --tags latest
          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore(flatpak): update ${{ matrix.app }} OCI index (x86_64 + aarch64)"
            git push origin main
          fi

  release-bundles:
    name: Attach bundles to release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-bundle'
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" *.flatpak --clobber --repo "${GITHUB_REPOSITORY}"
