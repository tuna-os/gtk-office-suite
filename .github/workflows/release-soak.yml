name: Release candidate soak

# #442's "larger soak and complete matrix on the release candidate", and the
# refusal that was missing with it.
#
# The scheduled campaign (gui-stress.yml, weekly) explores *different* seeds each
# run against whatever main happens to be. That answers "is this codebase
# stable", which is not the question a release asks. A release asks "is
# **this** revision stable", and the answer has to be obtained at the
# revision being published — crash-stress.md's initial stability target is
# zero failures in N consecutive runs of each critical journey per app at
# baseline, plus the admitted display matrix.
#
# Called by publish-flatpak.yml so it runs *before* the Flatpaks are pushed
# rather than beside them. A campaign that fails after publication is a
# report, not a gate.
#
# One job cannot hold the whole campaign: GitHub-hosted jobs are cut off at six
# hours whatever `timeout-minutes` says, and one attempt over the ~240
# journeys takes about 24 minutes, so 20 consecutive runs need about eight.
# v2.1.9's soak was cancelled at exactly 6h00m, at attempt 14 of 20. The
# repetitions are therefore sharded over parallel jobs, `PER_SHARD` attempts
# each, and the display matrix runs as a job of its own. The target is
# unchanged: every shard's attempts must pass, and the `publish` gate sees the
# worst result of all the jobs.
#
# Deliberately not on `schedule`: the nightly already covers that, and a
# second nightly copy would compete for the same runner hours while
# answering a question no release asked.

on:
  workflow_call:
    inputs:
      repeat:
        description: 'Consecutive runs of each journey (crash-stress.md stability target)'
        required: false
        type: number
        default: 20
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Consecutive runs of each journey'
        required: false
        default: '20'

concurrency:
  group: release-soak-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same image the recorded journeys and the nightly campaign use, so a
      # release verdict and a verification video describe one environment.
      - id: resolve
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          ref="ghcr.io/${REPOSITORY}/gui-test:main"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Using published image $ref"
          else
            echo "No published image yet; building and publishing $ref"
            docker build -t "$ref" -f tests/gui/container/Containerfile tests/gui/container
            docker push "$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  # How many shards the requested repetitions need.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          REPEAT: ${{ inputs.repeat || 20 }}
          PER_SHARD: '2'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os
          repeat = int(os.environ["REPEAT"])
          per = int(os.environ["PER_SHARD"])
          print("shards=" + json.dumps(list(range(1, math.ceil(repeat / per) + 1))))
          PY

  soak:
    needs: [image, plan]
    runs-on: ubuntu-24.04
    # Two attempts of ~24 minutes, the release build and the container start.
    timeout-minutes: 150
    strategy:
      # Every shard's verdict is evidence: one failing must not hide the rest.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    container:
      image: ${{ needs.image.outputs.ref }}  # zizmor: ignore[unpinned-images] the image job resolves this to the gui-test:main image that gui-container.yml publishes from main; pinning would change which image runs
      # GTK and Xvfb share memory through /dev/shm; the container default of
      # 64MB makes rendering fail in ways that look like app bugs.
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2.9.3

      # Release binaries, not debug: the thing being soaked has to be the
      # thing being shipped. A debug build has different timing, and timing
      # is most of what a repetition campaign measures.
      - name: Build the candidate binaries
        run: cargo build --release --bin letters --bin tables --bin decks

      # Every context value reaches the script through the environment,
      # never through `${{ }}` inside it (#492).
      #
      # Each shard has a seed of its own, derived from the run and the shard
      # so that shards started in the same second still shuffle differently,
      # and stress.py records it in the manifest so the shard replays.
      - name: Soak the candidate at baseline
        env:
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}
          # The journeys look for debug binaries unless told otherwise; this
          # job built release ones (every attempt of the first soaks failed in
          # setUp with "Binary not found" and was reported as a product crash).
          GUI_TEST_PROFILE: release
        run: |
          python3 tests/gui/stress.py \
            --repeat 2 \
            --seed "$(( (RUN_ID % 100000000) * 100 + SHARD ))" \
            --output "$GITHUB_WORKSPACE/soak-baseline"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate-soak-baseline-${{ matrix.shard }}
          path: soak-baseline
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          manifest="$GITHUB_WORKSPACE/soak-baseline/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "### Soak shard $SHARD: no manifest — the campaign did not start" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Release candidate soak — shard $SHARD"
            echo
            echo '```json'
            python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])).get('summary', {}), indent=2))" "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHARD: ${{ matrix.shard }}

  # The complete matrix, once through. Repetition and breadth are separate
  # instruments: repeating at one display size proves nothing about 400px, and
  # one pass over every size proves nothing about flakiness.
  matrix:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    container:
      image: ${{ needs.image.outputs.ref }}  # zizmor: ignore[unpinned-images] the image job resolves this to the gui-test:main image that gui-container.yml publishes from main; pinning would change which image runs
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build the candidate binaries
        run: cargo build --release --bin letters --bin tables --bin decks

      - name: The complete display matrix, once
        env:
          GUI_TEST_PROFILE: release
        run: |
          python3 tests/gui/stress.py \
            --repeat 1 --matrix display \
            --output "$GITHUB_WORKSPACE/soak-matrix"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate-soak-matrix
          path: soak-matrix
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          manifest="$GITHUB_WORKSPACE/soak-matrix/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "### soak-matrix: no manifest — the campaign did not start" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Release candidate soak — soak-matrix"
            echo
            echo '```json'
            python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])).get('summary', {}), indent=2))" "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
