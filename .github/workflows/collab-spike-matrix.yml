name: Collab spike A (Matrix binding)

# RFC-0004 Spike A: the Matrix binding of the Document Collaboration Protocol,
# measured against a real Synapse started in a container (docker here). Heavy
# (matrix-sdk) and needs docker, so it runs here and not on a developer box.
# Not part of the product CI.

on:
  push:
    branches: [spike/collab-matrix]
    paths:
      - 'tools/collab-spike/**'
      - '.github/workflows/collab-spike-matrix.yml'
  workflow_dispatch:

concurrency:
  group: collab-spike-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # Surfaced into the results document.
  SYNAPSE_IMAGE: docker.io/matrixdotorg/synapse:latest

permissions:
  contents: read

jobs:
  matrix:
    name: dcp-matrix against Synapse (relaxed + default rate limits)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: tools/collab-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike
          save-if: true

      - name: Output directory
        run: mkdir -p "$GITHUB_WORKSPACE/measurements"

      - name: Versions
        run: |
          rustc --version
          cargo --version
          docker --version

      # No --locked: Cargo.lock is regenerated by the integration step.
      - name: Build tests
        run: cargo test -p dcp-matrix --no-run

      - name: Journeys and conformance (Synapse, relaxed rate limits)
        env:
          DCP_MEASURE_OUT: ${{ github.workspace }}/measurements/relaxed-journeys.jsonl
        run: |
          set -euo pipefail
          eval "$(scripts/synapse-up.sh relaxed)"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/measurements/synapse-relaxed-journeys.log" 2>&1 || true; scripts/synapse-down.sh relaxed' EXIT
          cargo test -p dcp-matrix -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/measurements/journeys.log"

      - name: Measurements (relaxed rate limits)
        if: ${{ !cancelled() }}
        env:
          DCP_MEASURE_OUT: ${{ github.workspace }}/measurements/relaxed.jsonl
        run: |
          set -euo pipefail
          eval "$(scripts/synapse-up.sh relaxed)"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/measurements/synapse-relaxed.log" 2>&1 || true; scripts/synapse-down.sh relaxed' EXIT
          cargo test -p dcp-matrix --test measure -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/measurements/measure-relaxed.log"

      - name: Measurements (Synapse default rate limits)
        if: ${{ !cancelled() }}
        env:
          DCP_MEASURE_OUT: ${{ github.workspace }}/measurements/default.jsonl
        run: |
          set -euo pipefail
          eval "$(scripts/synapse-up.sh default)"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/measurements/synapse-default.log" 2>&1 || true; scripts/synapse-down.sh default' EXIT
          cargo test -p dcp-matrix --test measure -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/measurements/measure-default.log"

      - name: Journeys under Synapse's default rate limits
        if: ${{ !cancelled() }}
        env:
          DCP_MEASURE_OUT: ${{ github.workspace }}/measurements/default-journeys.jsonl
        run: |
          set -euo pipefail
          eval "$(scripts/synapse-up.sh default)"
          trap 'scripts/synapse-down.sh default' EXIT
          cargo test -p dcp-matrix --test journeys -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/measurements/journeys-default.log"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spike-a-measurements
          path: measurements/
          if-no-files-found: warn
