name: Nightly

# The full-cost checks split out of ci.yml (#108): LibreOffice interop
# oracle (installs LibreOffice, runs the full corpus against it) and
# coverage. These are real, meaningful checks — but running them on
# every single push/PR is exactly what turned 10 renovate PRs into a
# 26-run queue backlog this session (see docs/session memory on CI
# congestion). Nightly + on-demand keeps that cost off the PR fast lane
# without losing the coverage: a broken oracle/coverage run is still
# caught within a day, and workflow_dispatch lets anyone force a run
# immediately (e.g. before merging a change that touches format I/O).

on:
  schedule:
    - cron: '0 5 * * *'   # daily at 5am UTC (before gui-tests.yml's 6am)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege: these jobs only read the repository (#349).
permissions:
  contents: read

jobs:
  # LibreOffice interop oracle: every .docx letters-core writes must open
  # in LibreOffice Writer and extract identical text (both directions).
  # Core crates only — no GTK needed. REQUIRE_SOFFICE turns a missing
  # oracle into a failure so this check can never silently skip.
  oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LibreOffice (headless Writer, Calc, Impress)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Run oracle tests
        env:
          REQUIRE_SOFFICE: "1"
        run: cargo test -p letters-core -p tables-core -p decks-core --test soffice_oracle
      - name: Run LibreOffice-authored parity corpus
        env:
          REQUIRE_SOFFICE: "1"
        run: cargo test -p letters-core -p decks-core --test lo_parity -- --nocapture

      - name: Conformance scorecard (job summary)
        env:
          REQUIRE_SOFFICE: "1"
        run: python3 conformance/scorecard.py

      - name: Upload capability-matrix artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-scorecard
          path: conformance/scorecard-latest.md
          retention-days: 90

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK4 deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov --quiet
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Run coverage
        run: cargo llvm-cov --workspace --summary-only

  fuzz-smoke:
    name: Fuzz importer smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # A document package is a ZIP: a local header, a central directory and
      # a matching CRC have to be right before a reader looks at one byte of
      # XML. libFuzzer starting from nothing does not reach that inside a
      # bounded run, so without seeds these targets spent their whole budget
      # failing to produce a readable archive.
      #
      # The seeds come from this suite's own writers rather than committed
      # binaries: they cannot drift from what the writers produce, the
      # generators are reviewable source, and each generator reads every
      # seed back and fails if its own reader rejects one.
      - name: Generate the seed corpus
        run: |
          set -o pipefail
          cargo run -p letters-core --example fuzz_seed_corpus -- fuzz/corpus
          cargo run -p decks-core   --example fuzz_seed_corpus -- fuzz/corpus
          cargo run -p tables-core  --example fuzz_seed_corpus -- fuzz/corpus
          find fuzz/corpus -type f | wc -l | xargs echo "seed files:"

      # Every path a document can enter the suite through, not just the
      # OOXML three: the ODF read side had no target at all, and the
      # readers that return no Result (the best-effort xlsx parts,
      # markdown::parse, parse_master_shapes) can only fail by panicking.
      #
      # AddressSanitizer, not `--sanitizer none`. The four core crates
      # contain no `unsafe` at all, so on its own that choice was
      # defensible — but what they hand attacker-controlled bytes to is
      # not this suite's code. The decompression stack underneath is Rust
      # reimplementations of C libraries, and they are `unsafe`-heavy:
      # zlib-rs (451 occurrences), libbz2-rs-sys (142), lzma-rust2 (16),
      # miniz_oxide (4). A decompressor fed hostile input is the classic
      # memory-safety target, and running it unsanitised is where a real
      # finding would go unnoticed.
      - name: Run bounded importer fuzz smoke
        run: |
          set -o pipefail
          for target in letters_docx letters_odt letters_markdown \
                        tables_xlsx tables_xlsx_parts tables_ods \
                        decks_pptx decks_odp decks_master_shapes; do
            cargo fuzz run "$target" --sanitizer address -- \
              -runs=1000 -max_len=1048576 -timeout=10 -rss_limit_mb=2048
          done
      - name: Upload minimized fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
