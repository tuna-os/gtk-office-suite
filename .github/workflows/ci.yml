name: CI

on: [push, pull_request]

# Rapid alpha pushes: newer commits supersede queued/running CI for the
# same ref instead of stacking up and starving the runner pool.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: every job here only reads the repository. Nothing posts
# comments, pushes tags, or publishes packages, so the default write-capable
# token was more authority than any step needs (#349).
permissions:
  contents: read

jobs:
  interop-corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate versioned office corpus
        run: python3 interop/validate_corpus.py

  # The Python tooling had unit tests and a parity validator that nothing ran
  # (#313). `interop-corpus` above runs one validator; these are the tests *of*
  # the validators, plus the parity gate that conformance/validate_parity.py's
  # own docstring says is meant to run in PR CI.
  python-checks:
    name: Python validators and their tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # E4 below diffs docs/PARITY.md against the base branch, which needs
          # more than the default single-commit checkout.
          fetch-depth: 0

      # Xvfb and friends are here for the harness self-tests, not for a
      # display: InjectedSetupFailures drives run_gui_tests.sh with one
      # part of setup deliberately broken and asserts it fails loudly and
      # cleans up. Those are the only pieces of setup the assertions touch
      # (glib-compile-schemas for the schema step, Xvfb for the display
      # handshake, xdpyinfo for the readiness probe); no journey runs here,
      # so dogtail and the apps are not needed.
      - name: Install pytest and the pieces of GUI setup under test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pytest xvfb x11-utils libglib2.0-bin

      - name: Unit tests for the release-gate and parity validators
        run: |
          python3 -m pytest -q \
            tests/test_release_gate.py \
            tests/test_validate_parity.py \
            tests/test_gui_evidence.py \
            tests/test_validate_capabilities.py \
            tests/test_gui_stress.py \
            tests/test_gui_harness.py \
            tests/test_journey_selection.py \
            tests/test_oracle_triggers.py \
            tests/test_roadmap_figures.py \
            tests/adaptive_editor_contract.py

      # E1-E3: green rows cite evidence, referenced paths exist, journey-gated
      # features are not green on model-only evidence.
      - name: Parity scorecard structure
        run: python3 conformance/validate_parity.py

      # C1/C5/C6: the capability ledger says what it must, its waivers are
      # dated and owned, and no GUI test class or method is defined twice
      # (a duplicate silently replaces the first and its tests stop
      # running — that is how the #507 crash reproduction went missing).
      # The evidence-vs-reality checks need collected tests, so they run
      # in the lanes that collect them.
      #
      # --lanes adds the check that needs no test run: every cited test is
      # in a namespace some lane actually collects. Without it an id in a
      # namespace *no* lane covers was skipped by every lane and accepted
      # — a claim citing tests/nonexistent/... passed the GUI lane with
      # "CAPABILITY LEDGER OK" (#313).
      - name: Capability ledger structure and lane coverage
        run: python3 conformance/validate_capabilities.py --lanes conformance/lanes.json

      # This lane collects the validator and harness tests, so it is the
      # one that can check the ledger's claims about them — the `tests/`
      # namespace had no lane at all, and `ci.recorded-journey-evidence`
      # cites it.
      - name: Capability ledger vs. the validator tests this lane collects
        run: |
          # One -q: verbosity is (-v) minus (-q), and unlike the GUI
          # runner this adds no -v, so a second -q drops below the node-id
          # listing to per-file counts — which parses as zero tests.
          python3 -m pytest --collect-only -q \
            tests/test_release_gate.py \
            tests/test_validate_parity.py \
            tests/test_gui_evidence.py \
            tests/test_validate_capabilities.py \
            tests/test_gui_stress.py \
            tests/test_gui_harness.py \
            tests/test_journey_selection.py \
            tests/test_oracle_triggers.py \
            tests/test_roadmap_figures.py \
            tests/adaptive_editor_contract.py > python-collected.txt
          python3 conformance/collect_test_inventory.py \
            --pytest "tests=python-collected.txt" --out python-inventory.json
          python3 conformance/validate_capabilities.py \
            --lanes conformance/lanes.json --lane python-checks \
            --collected python-inventory.json

      # E4: no silent green -> non-green regression, and no jump to green
      # without new evidence. Only meaningful against a base branch.
      - name: Parity scorecard transitions vs base
        if: github.event_name == 'pull_request'
        # The base branch name reaches the shell through the environment,
        # not through `${{ }}` inside the script: a ref can contain shell
        # metacharacters, and expression interpolation pastes them into the
        # script before bash ever sees a quote (#492).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:docs/PARITY.md" > /tmp/base-parity.md
          python3 conformance/validate_parity.py --base /tmp/base-parity.md

  # RustSec advisory gate. `deny.toml` has existed since #271 but nothing ever
  # ran it, so the configured policy was documentation rather than a gate
  # (#269, #330).
  #
  # Only `check advisories` — `deny.toml` configures the [advisories] section
  # and nothing else, so a bare `cargo deny check` would apply default
  # bans/licenses/sources policy that this project has never agreed to.
  #
  # Expect this job to be the one that goes red without a code change: the
  # advisory database updates independently of this repository, so a newly
  # published advisory against an existing dependency fails the next run. That
  # is the point of the gate. Triage the advisory — upgrade, or add an `ignore`
  # entry to `deny.toml` with a reason — rather than removing this job.
  advisories:
    name: RustSec advisory gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Unit tests + clippy on Ubuntu 24.04 (has GTK 4.14 + libadwaita 1.5)
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Xvfb because the workspace contains GTK widget tests. Without a
      # display `suite_common::gtk_test::run` cannot initialise GTK, and
      # this job used to run the whole workspace with none: all 36 GTK
      # widget tests in Letters skipped on every pull request while the
      # harness reported "0 ignored", so neither the log nor the ledger
      # gate below could see it (#241).
      - name: Install GTK4 + libadwaita dev libraries and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev xvfb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy (deny warnings, all crates)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest doesn't run doctests (a known limitation) — cargo test
      # --doc covers those separately. #108: JUnit output published as
      # an artifact even on failure, so a failing run's per-test detail
      # survives past the job's own log retention.
      - name: cargo nextest run
        run: xvfb-run -a cargo nextest run --workspace --profile ci

      - name: cargo test --doc
        run: xvfb-run -a cargo test --doc --workspace

      # C3/C4 for the Rust layers: the ledger's claims must name tests
      # this run actually collected, and none of them may have been
      # skipped or failed. The JUnit report nextest already writes says
      # both, so this costs a second and uses the results of the run that
      # just happened rather than a re-derivation. The report names the
      # crates it covers, so it checks the Rust ids and stays quiet about
      # the journeys, which the GUI lane checks.
      - name: Capability ledger vs. the tests that ran
        run: |
          python3 conformance/collect_test_inventory.py \
            --junit "=target/nextest/ci/junit.xml" \
            --out rust-inventory.json --results-out rust-results.json
          python3 conformance/validate_capabilities.py \
            --lanes conformance/lanes.json --lane test \
            --collected rust-inventory.json --results rust-results.json

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # LibreOffice interop oracle and coverage moved to nightly.yml (#108):
  # installing LibreOffice + running the full oracle/parity corpus on
  # every single push/PR is what turned this session's 10 renovate PRs
  # into a 26-run GitHub Actions queue backlog. Still runs daily plus
  # on-demand via workflow_dispatch — see nightly.yml for the reasoning.

  # Flatpak builds — uses Flatpak SDK container (no Rust needed)
  flatpak:
    runs-on: ubuntu-24.04
    needs: [test]
    strategy:
      matrix:
        app: [letters, tables, decks]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build Flatpak — org.tunaos.${{ matrix.app }}
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ matrix.app }}.flatpak
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          cache-key: flatpak-${{ matrix.app }}-${{ github.sha }}
