name: GUI Tests

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6am UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gui-tests-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository (#349).
permissions:
  contents: read

jobs:
  # Deterministic AT-SPI smoke tests. These GATE: no `|| true`, no VLM.
  # If they fail, an app does not launch or basic input is broken.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # #108: only run the AT-SPI journeys for apps a change could
      # actually affect, instead of always running all three. A change
      # to a shared crate (suite-common*, suite-export) or the test
      # harness itself can affect every app, so those — and anything we
      # fail to classify — fall back to running everything. Silence here
      # would mean silently losing coverage, so "unsure" always means
      # "run it all," never "skip it."
      - name: Determine affected apps
        id: affected
        # Every GitHub context value arrives through the environment. A
        # `${{ }}` expression inside the script is pasted in before bash
        # parses it, so a ref or event field containing shell
        # metacharacters would run as code (#492).
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              echo "filter=" >> "$GITHUB_OUTPUT"
              echo "Scheduled/manual run: testing all apps." ;;
            *)
              if [ "$EVENT_NAME" = "pull_request" ]; then
                base="$PR_BASE_SHA"
              else
                base="$PUSH_BEFORE"
              fi
              if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
                echo "filter=" >> "$GITHUB_OUTPUT"
                echo "No usable base commit: testing all apps."
              else
                changed=$(git diff --name-only "$base" "$HEAD_SHA")
                echo "Changed files:"; echo "$changed"
                shared=0
                echo "$changed" | grep -qE '^(suite-common|suite-common-core|suite-export)/|^tests/gui/(framework/|conftest|run_gui_tests\.sh)|^Cargo\.(toml|lock)$' && shared=1
                apps=""
                if [ "$shared" = "1" ]; then
                  echo "Shared crate or test-harness change: testing all apps."
                else
                  echo "$changed" | grep -qE '^letters(-core)?/' && apps="$apps Letters"
                  echo "$changed" | grep -qE '^tables(-core)?/' && apps="$apps Tables"
                  echo "$changed" | grep -qE '^decks(-core)?/' && apps="$apps Decks"
                fi
                if [ "$shared" = "1" ] || [ -z "$apps" ]; then
                  echo "filter=" >> "$GITHUB_OUTPUT"
                  # A bare `a && b && echo` here is the step's last command, so
                  # when it evaluates false (shared=1) its non-zero status kills
                  # the step under `bash -e` — after it has already decided
                  # correctly. Keep it a real conditional.
                  if [ -z "$apps" ] && [ "$shared" != "1" ]; then
                    echo "No recognized app path changed: testing all apps (fail-safe)."
                  fi
                else
                  # The bare expression, without the -k or its quoting: the
                  # step that runs pytest turns it into a real argument, so
                  # no quoting has to survive a round trip through a step
                  # output and a second shell parse.
                  filter=$(echo "$apps" | xargs | sed 's/ / or /g')
                  echo "filter=$filter" >> "$GITHUB_OUTPUT"
                  echo "Testing only: $filter"
                fi
              fi ;;
          esac

      - name: Install GTK4 + libadwaita dev libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build app binaries
        run: cargo build --bin letters --bin tables --bin decks

      - name: Install GUI test dependencies
        run: |
          sudo apt-get install -y -qq xvfb dbus at-spi2-core matchbox-window-manager xdotool \
            x11-utils ffmpeg python3-dogtail python3-pytest python3-pil python3-requests
          python3 -m pip install --break-system-packages mss

      # GUI_TEST_VIDEO=failures records every journey and keeps only the
      # clips of the ones that failed. A smoke failure means an app did
      # not launch or input did not land — questions a log rarely answers
      # and thirty seconds of video usually does. Recording is free of
      # verdicts: a missing ffmpeg would warn, not fail.
      - name: Run smoke tests
        env:
          GUI_TEST_VIDEO: failures
          GUI_TEST_VIDEO_DIR: ${{ github.workspace }}/tests/gui/videos
          JOURNEY_FILTER: ${{ steps.affected.outputs.filter }}
        run: |
          set --
          if [ -n "$JOURNEY_FILTER" ]; then
            set -- -k "$JOURNEY_FILTER"
          fi
          tests/gui/run_gui_tests.sh test_smoke.py "$@"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-artifacts
          path: |
            tests/gui/failure_artifacts
            tests/gui/videos
          retention-days: 14
          if-no-files-found: ignore

      - name: Run buffer-bridge round-trip tests (Xvfb)
        run: xvfb-run -a cargo test -p letters bridge

  # VLM-judged visual audit. Non-gating (continue-on-error): screenshot
  # judgments flake on model output and need API keys, so they inform
  # rather than block. Failures are still visible in the job UI.
  vlm-audit:
    runs-on: ubuntu-24.04
    needs: smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK4 + libadwaita dev libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build binary
        env:
          APP: ${{ matrix.app }}
        run: cargo build --bin "$APP"

      - name: Install GUI test dependencies
        run: |
          sudo apt-get install -y -qq xvfb dbus at-spi2-core matchbox-window-manager xdotool \
            python3-dogtail python3-pytest python3-pil python3-requests
          python3 -m pip install --break-system-packages mss

      - name: Run VLM tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          VLM_BACKEND: gemini
          APP: ${{ matrix.app }}
        run: tests/gui/run_gui_tests.sh "test_${APP}.py"

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.app }}
          path: tests/gui/*.png
          retention-days: 7
