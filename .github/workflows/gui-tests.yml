name: GUI Tests

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6am UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gui-tests-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository (#349).
# Lean dev builds, as in ci.yml: backtraces keep file and line, and the
# cache stays a fraction of the size.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  # Deterministic AT-SPI smoke tests. These GATE: no `|| true`, no VLM.
  # If they fail, an app does not launch or basic input is broken.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # #108: only run the AT-SPI journeys for apps a change could
      # actually affect, instead of always running all three. A change
      # to a shared crate (suite-common*, suite-export) or the test
      # harness itself can affect every app, so those — and anything we
      # fail to classify — fall back to running everything. Silence here
      # would mean silently losing coverage, so "unsure" always means
      # "run it all," never "skip it."
      - name: Determine affected apps
        id: affected
        # Every GitHub context value arrives through the environment. A
        # `${{ }}` expression inside the script is pasted in before bash
        # parses it, so a ref or event field containing shell
        # metacharacters would run as code (#492).
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              echo "filter=" >> "$GITHUB_OUTPUT"
              echo "Scheduled/manual run: testing all apps." ;;
            *)
              if [ "$EVENT_NAME" = "pull_request" ]; then
                base="$PR_BASE_SHA"
              else
                base="$PUSH_BEFORE"
              fi
              if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
                echo "filter=" >> "$GITHUB_OUTPUT"
                echo "No usable base commit: testing all apps."
              else
                changed=$(git diff --name-only "$base" "$HEAD_SHA")
                echo "Changed files:"; echo "$changed"
                # The classification lives in a script rather than inline
                # here so that its conservative fallbacks can be tested:
                # picking too few apps produces a green run that never
                # launched the app the change broke, which no amount of
                # reading this YAML would catch. See
                # tests/test_journey_selection.py. It prints the -k
                # expression on stdout (empty means every app) and the
                # reason on stderr, so the log still says what it decided.
                filter=$(printf '%s\n' "$changed" | tests/gui/select_journeys.sh)
                echo "filter=$filter" >> "$GITHUB_OUTPUT"
              fi ;;
          esac

      - name: Install GTK4 + libadwaita dev libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Pull requests restore main's cache and do not save their own (ci.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build app binaries
        run: cargo build --bin letters --bin tables --bin decks

      - name: Install GUI test dependencies
        run: |
          sudo apt-get install -y -qq xvfb dbus at-spi2-core matchbox-window-manager xdotool \
            x11-utils ffmpeg python3-dogtail python3-pytest python3-pil python3-requests
          python3 -m pip install --break-system-packages mss

      # GUI_TEST_VIDEO=failures records every journey and keeps only the
      # clips of the ones that failed. A smoke failure means an app did
      # not launch or input did not land — questions a log rarely answers
      # and thirty seconds of video usually does. Recording is free of
      # verdicts: a missing ffmpeg would warn, not fail.
      - name: Run smoke tests
        env:
          GUI_TEST_VIDEO: failures
          GUI_TEST_VIDEO_DIR: ${{ github.workspace }}/tests/gui/videos
          # Every GLib/GTK CRITICAL or WARNING the apps log, per journey
          # (#1209). A CRITICAL also fails its journey; the log keeps the
          # warnings as evidence, uploaded below.
          GUI_TEST_DIAGNOSTICS_LOG: ${{ github.workspace }}/gtk-diagnostics/smoke.jsonl
          JOURNEY_FILTER: ${{ steps.affected.outputs.filter }}
        run: |
          set --
          if [ -n "$JOURNEY_FILTER" ]; then
            set -- -k "$JOURNEY_FILTER"
          fi
          # test_edit_render.py: the edit -> save -> reopen journeys whose
          # saved files the render lab also compares against LibreOffice.
          # --junitxml: each journey's outcome, which the ledger step below
          # judges; a collected journey with no outcome did not run (SH-001).
          tests/gui/run_gui_tests.sh test_smoke.py test_edit_render.py "$@" \
            --junitxml="$GITHUB_WORKSPACE/smoke-junit.xml"

      # Not filtered by app, and deliberately not inside test_smoke.py:
      # these drive a journey that fails on purpose and assert on what it
      # left behind, so they are about the harness rather than about any
      # one app. A per-app -k filter would skip them on exactly the
      # changes most likely to break artifact capture.
      #
      # !cancelled(): independent of the app journeys, so one failing app
      # journey must not leave the harness evidence unrun — the ledger step
      # below would otherwise find no harness report and could judge none
      # of the other cited journeys either.
      - name: Harness retains evidence when a journey fails before its body
        if: ${{ !cancelled() }}
        env:
          GUI_TEST_VIDEO: failures
          GUI_TEST_VIDEO_DIR: ${{ github.workspace }}/tests/gui/videos
        run: |
          # Printed because the core-dump half of this is conditional on it,
          # and a conditional claim nobody can see the condition for is the
          # shape of a check that passes without checking. A relative name
          # (`core`) means a dump lands next to the app and is retained; a
          # pipe (`|/usr/share/apport/apport …`) means the kernel hands it to
          # a handler and there is no file for a container to keep — the
          # journeys accept either, so this line is how a reader tells which
          # happened on this runner.
          echo "kernel core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          tests/gui/run_gui_tests.sh test_harness_artifacts.py \
            --junitxml="$GITHUB_WORKSPACE/harness-junit.xml"

      # C3/C4/C9 for the GUI layer: a journey the ledger cites must still be
      # collected under that name, and must have passed in this run unless
      # the change-based selection above left it out — in which case it is
      # listed as not selected, never counted as passing. Collection is cheap
      # and runs after the journeys themselves, so a rename shows up as a
      # ledger failure rather than as evidence that quietly stopped meaning
      # anything.
      - name: Capability ledger vs. collected and completed journeys
        if: always()
        env:
          JOURNEY_FILTER: ${{ steps.affected.outputs.filter }}
        run: |
          # -q twice: the runner appends its own -v, and pytest's
          # verbosity is (-v count) minus (-q count) — one -q only cancels
          # it back to the tree listing, two gives the node ids this
          # parses.
          tests/gui/run_gui_tests.sh test_smoke.py test_edit_render.py test_harness_artifacts.py \
            --collect-only -q -q > collected.txt
          # The selection the journeys actually ran with, taken from pytest
          # rather than restated: the same -k over the same files, and the
          # unfiltered harness file. What it leaves out is recorded as
          # deselected; a journey missing from both it and the reports is a
          # journey that did not run.
          selection=()
          if [ -n "$JOURNEY_FILTER" ]; then
            {
              tests/gui/run_gui_tests.sh test_smoke.py test_edit_render.py \
                -k "$JOURNEY_FILTER" --collect-only -q -q
              tests/gui/run_gui_tests.sh test_harness_artifacts.py --collect-only -q -q
            } > selected.txt
            selection=(--pytest-selected "tests/gui=selected.txt")
          fi
          python3 conformance/collect_test_inventory.py \
            --pytest "tests/gui=collected.txt" "${selection[@]}" \
            --pytest-junit "tests/gui=smoke-junit.xml" \
            --pytest-junit "tests/gui=harness-junit.xml" \
            --revision "$GITHUB_SHA" \
            --out gui-inventory.json --results-out gui-results.json
          python3 conformance/validate_capabilities.py \
            --lanes conformance/lanes.json --lane smoke \
            --collected gui-inventory.json --results gui-results.json \
            --candidate "$GITHUB_SHA"

      - name: Keep the journeys' outcomes and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-ledger-evidence
          path: |
            smoke-junit.xml
            harness-junit.xml
            gui-inventory.json
            gui-results.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-failure-artifacts
          path: |
            tests/gui/failure_artifacts
            tests/gui/videos
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload GTK diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gtk-diagnostics
          path: gtk-diagnostics
          retention-days: 14
          if-no-files-found: ignore

      - name: Run buffer-bridge round-trip tests (Xvfb)
        run: scripts/with-display.sh cargo test -p letters bridge

  # VLM-judged visual audit. Non-gating (continue-on-error): screenshot
  # judgments flake on model output and need API keys, so they inform
  # rather than block. Failures are still visible in the job UI.
  vlm-audit:
    runs-on: ubuntu-24.04
    needs: smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install GTK4 + libadwaita dev libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build binary
        env:
          APP: ${{ matrix.app }}
        run: cargo build --bin "$APP"

      - name: Install GUI test dependencies
        run: |
          sudo apt-get install -y -qq xvfb dbus at-spi2-core matchbox-window-manager xdotool \
            x11-utils python3-dogtail python3-pytest python3-pil python3-requests
          python3 -m pip install --break-system-packages mss

      - name: Run VLM tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          VLM_BACKEND: gemini
          APP: ${{ matrix.app }}
        run: tests/gui/run_gui_tests.sh "test_${APP}.py"

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: screenshots-${{ matrix.app }}
          path: tests/gui/*.png
          retention-days: 7
