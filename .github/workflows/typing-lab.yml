name: Typing lab

# A diagnostic, not a gate: which letters does xdotool lose on the way to a
# GTK entry? See tools/typing-lab/typing_lab.py. The release soak loses a "p".

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/typing-lab/**
      - .github/workflows/typing-lab.yml

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install an X server, a window manager, xdotool and GTK4 for Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb dbus at-spi2-core matchbox-window-manager xdotool \
            x11-utils python3-gi gir1.2-gtk-4.0
      - name: Type into a GTK entry in every mode
        run: |
          xdotool version
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c '
            matchbox-window-manager -use_titlebar no &
            sleep 1
            TRIALS=100 python3 tools/typing-lab/typing_lab.py
          ' | tee typing-lab.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typing-lab
          path: typing-lab.txt
