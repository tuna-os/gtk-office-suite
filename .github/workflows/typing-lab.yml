name: Typing lab

# A diagnostic, not a gate: which letters does xdotool lose on the way to a
# GTK entry? See tools/typing-lab/typing_lab.py. The release soak loses a "p".

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/typing-lab/**
      - .github/workflows/typing-lab.yml

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install an X server, a window manager, xdotool and GTK4 for Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb dbus at-spi2-core matchbox-window-manager xdotool \
            x11-utils python3-gi gir1.2-gtk-4.0
      - name: Type into a GTK entry in every mode
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c '
            matchbox-window-manager -use_titlebar no &
            sleep 1
            xdotool version
            TRIALS=100 python3 tools/typing-lab/typing_lab.py
          ' | tee typing-lab.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typing-lab
          path: typing-lab.txt


  # The cause, tested: Print Preview's Ctrl+Shift+P leaves "p" down at the X
  # server, and the next journey that types a "p" loses it. Print Preview and a
  # journey that types "apple", shuffled, 40 times: with the release off
  # (GUI_TEST_RELEASE_KEYS=0) attempts where Print Preview runs first should
  # lose the "p"; with it on, none should.
  stuck-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ['0', '1']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK4 + libadwaita dev libraries and the GUI test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev xvfb poppler-utils \
            dbus at-spi2-core matchbox-window-manager xdotool x11-utils \
            python3-dogtail python3-pytest python3-pil python3-requests
          python3 -m pip install --break-system-packages mss
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: typing-lab-release
      - name: Build the apps
        run: cargo build --release --bin letters --bin tables --bin decks
      - name: Print Preview and a journey that types "apple", shuffled, 40 times
        env:
          GUI_TEST_PROFILE: release
          GUI_TEST_VERIFY_TYPING: '1'
          GUI_TEST_RELEASE_KEYS: ${{ matrix.release }}
        run: |
          python3 tests/gui/stress.py \
            --repeat 40 --timeout 3000 \
            --select "test_print_preview_reports_single_page or test_clear_filter_keeps_manual_hides" \
            --output "$GITHUB_WORKSPACE/lab-stuck"
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("lab-stuck/manifest.json"))
          print(json.dumps(m.get("summary", {}), indent=2))
          for a in m["attempts"]:
              first = a["order"][0].split("::")[-1]
              print(a["index"], a["classification"], "first:", first)
          PY
