name: Screenshots

# Regenerate the README walkthrough and the feature-overview screenshots
# (docs/features/) from the real apps, and land them on main when they
# visibly change.
#
# On every push to main that can change what the apps look like, plus
# weekly (font and runtime updates) and on demand. Rendering noise is not
# a change: keep_changed_screenshots.py puts back every image whose
# differences are anti-aliasing or a clock, so a refresh is only proposed
# when the UI moved.

on:
  push:
    branches: [main]
    paths:
      - 'letters/**'
      - 'letters-core/**'
      - 'tables/**'
      - 'tables-core/**'
      - 'decks/**'
      - 'decks-core/**'
      - 'suite-common/**'
      - 'suite-common-core/**'
      - 'flatpak/*.gschema.xml'
      - 'tests/gui/walkthrough.py'
      - 'tests/gui/feature_tour.py'
      - 'tests/gui/capture_walkthrough.sh'
      - 'tests/gui/keep_changed_screenshots.py'
      - 'tests/gui/demo/**'
      - '.github/workflows/screenshots.yml'
  schedule:
    - cron: '0 7 * * 1'   # Mondays 7am UTC
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write
  # `gh pr create` below needs this; without it the step 403s after the
  # branch has already been pushed, which is a worse failure than the one
  # it replaced — work done, nothing proposed.
  pull-requests: write
  # To start CI on the refresh branch (`gh workflow run`): see below.
  actions: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install GTK4 + libadwaita dev libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build app binaries
        run: cargo build --bin letters --bin tables --bin decks

      - name: Install walkthrough dependencies
        run: |
          sudo apt-get install -y -qq xvfb dbus at-spi2-core \
            python3-dogtail python3-pil xcompmgr
          python3 -m pip install --break-system-packages mss

      - name: Capture walkthrough and feature tour
        run: tests/gui/capture_walkthrough.sh docs/screenshots

      # Every capture differs from the last in some pixels; only a visible
      # change is worth a pull request.
      - name: Keep only visible changes
        id: changes
        run: |
          python3 tests/gui/keep_changed_screenshots.py docs/screenshots docs/features/img | tee changes.txt
          echo "count=$(tail -1 changes.txt | sed 's/changed: //')" >> "$GITHUB_OUTPUT"

      # Opens a pull request instead of pushing to main, because pushing to
      # main cannot work: `main` requires the `test` status check, and this
      # job's commit carried `[skip ci]`, so the check it needed was the one
      # thing the commit guaranteed would never run. Every dispatch that
      # actually had new screenshots to commit died here:
      #
      #   remote: error: GH006: Protected branch update failed for refs/heads/main.
      #   remote: - Required status check "test" is expected.
      #   ! [remote rejected] main -> main (protected branch hook declined)
      #
      # A deadlock, not a flake, and it had been failing since protection
      # was enabled — silently, because a screenshot run nobody watches
      # failing on its last step looks the same as one that had nothing to
      # do.
      #
      # The pull request then deadlocked the same way, one step later: a
      # push made with GITHUB_TOKEN starts no workflows, so CI never ran on
      # the refresh branch, `test` never reported, and #1150 sat unmergeable
      # with zero checks. A dispatch is the one event that token may start,
      # so this job runs CI on the branch itself, then turns on auto-merge:
      # a refresh lands by itself once CI is green, with nobody to remember
      # it. If the repository does not allow auto-merge, the pull request
      # is still opened, with its checks, and says so.
      - name: Open or refresh the pull request, run CI on it, merge when green
        if: steps.changes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "screenshot-bot"
          git config user.email "actions@github.com"
          git add -A docs/screenshots docs/features/img
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi

          # One long-lived branch, force-pushed: successive runs replace
          # the pending refresh rather than pile up a branch and a pull
          # request each. Screenshots are regenerated wholesale, so there
          # is no history here worth keeping.
          branch="bot/screenshot-refresh"
          git commit -m "docs: refresh screenshots" -m "$(grep -v '^noise' changes.txt)"
          git push --force origin "HEAD:refs/heads/$branch"

          {
            echo "Regenerated from the real apps by the Screenshots workflow"
            echo "(\`${GITHUB_SHA::7}\`, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "Only images that visibly changed are included; rendering noise"
            echo "(anti-aliasing, a clock) was put back by keep_changed_screenshots.py."
            echo
            echo '```'
            grep -v '^noise' changes.txt
            echo '```'
            echo
            echo "Merges itself once CI is green."
          } > /tmp/pr-body.md

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$branch" \
              --title "docs: refresh screenshots" --body-file /tmp/pr-body.md
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          fi

          gh workflow run ci.yml --ref "$branch"
          if ! gh pr merge "$pr" --auto --squash; then
            echo "::warning::Auto-merge is not enabled for this repository; PR #$pr has its checks and needs merging by hand."
          fi
