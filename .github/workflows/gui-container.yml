name: GUI test container

# Builds and publishes the image the GUI journeys run in
# (tests/gui/container/Containerfile). Everything that needs a display,
# a window manager, an a11y bus or a video encoder uses this one image,
# so CI and a developer's machine are the same environment.

on:
  push:
    branches: [main]
    paths:
      - 'tests/gui/container/**'
      - '.github/workflows/gui-container.yml'
  pull_request:
    paths:
      - 'tests/gui/container/**'
      - '.github/workflows/gui-container.yml'
  schedule:
    - cron: '0 5 * * 1'   # Mondays: pick up base-image security updates
  workflow_dispatch:

concurrency:
  group: gui-container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Read-only validation, run for every trigger including pull requests.
  # It builds whatever Containerfile the PR carries, so it must never hold
  # a package-write token; publishing is the separate `publish` job below.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: tests/gui/container
          file: tests/gui/container/Containerfile
          load: true
          tags: gui-test:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the tools the journeys call are all
      # present and runnable. Checking that here means a broken image
      # fails this workflow instead of every GUI job that later pulls it.
      - name: Verify the image can build, display and record
        run: |
          docker run --rm gui-test:candidate bash -euo pipefail -c '
            cargo --version
            pkg-config --modversion gtk4 libadwaita-1
            grep -q gtk-icon-cache-race /etc/gtk-office-suite/gtk-patches
            ffmpeg -version | head -1
            command -v Xvfb matchbox-window-manager xdotool xdpyinfo xprop \
                       glib-compile-schemas gapplication dbus-run-session
            python3 -c "import dogtail, mss, PIL, pytest; print(\"python deps ok\")"

            # Record a real X display and prove the result is a playable
            # file. An image that builds but cannot encode would otherwise
            # only fail later, in a job that is trying to prove something
            # else.
            Xvfb :77 -screen 0 1280x800x24 &
            sleep 2
            export DISPLAY=:77
            xdpyinfo | grep dimensions
            ffmpeg -hide_banner -loglevel error -y -f x11grab -video_size 1280x800 \
              -framerate 10 -i :77 -t 2 -c:v libx264 -pix_fmt yuv420p /tmp/probe.mp4
            duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/probe.mp4)
            echo "recorded ${duration}s probe clip"
          '

  # Publishes from main, the scheduled rebuild and manual dispatch only, so
  # no pull request can change the environment other branches test in
  # without review. It rebuilds from the pushed commit rather than reusing
  # the validation job's output, which keeps `packages: write` out of the
  # job that builds PR-controlled code.
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: tests/gui/container
          file: tests/gui/container/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/gui-test:main
            ghcr.io/${{ github.repository }}/gui-test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
