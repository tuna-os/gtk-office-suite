name: Render parity (real documents)

# The render lab over published real documents (#1200) instead of the
# single-feature fixtures: about 30 per app from gov.uk and open.canada.ca,
# listed with source, licence and sha256 in
# tools/render-lab/real_corpus/manifest.json. The fixtures find bugs; this
# shows whether users would notice them.
#
# Nightly, on demand, and on every pull request. Each app's job first asks
# tools/render-lab/real_scope.py whether the change reaches that app's
# rendering — its crate and every workspace crate it links (derived from
# the Cargo manifests), the lockfile, the workspace manifest, the lab and
# this workflow — and passes in seconds when it does not. It used to be
# path-filtered to the corpus and the lab, so engine changes skipped it:
# DCK-006 (#1574) touched only decks-core and turned a real deck from amber
# to red, caught by a later manual dispatch instead of on the PR. Running
# the workflow on every PR and deciding per step, never with a job-level
# `if:` or a `paths:` filter, is what keeps all three checks reporting, so
# they can be required (conformance/required-checks.json).
#
# Verdicts ratchet against tools/render-lab/baseline-real.json, separately
# from the fixtures' baseline.json: a regression fails the job, and so does
# an improvement not committed to the baseline. The documents are fetched
# once and cached by the corpus manifest's hash, so a source that later
# disappears does not take the run down; one that cannot be fetched at all
# shows as `missing` against its baseline verdict.

on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
  pull_request:

concurrency:
  group: render-real-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lab:
    name: Real documents (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Read-only: on a pull request this runs the pull request's own code,
    # so it gets no token that can write (#1678). `publish` posts from main.
    permissions:
      contents: read
      issues: read
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # On a pull request this is its merge commit; the scope step
          # diffs it against its first parent, the base branch it merges
          # into, which is all the history it needs.
          fetch-depth: 2

      # Decided per step, not with a job-level `if:`: a skipped matrix job
      # reports under its unexpanded name, so the required
      # "Real documents (<app>)" check would never arrive. An app the
      # change does not reach passes here, in seconds. Not a pull request
      # (schedule, dispatch): every app runs.
      - name: Does the change reach ${{ matrix.app }}'s rendering?
        id: scope
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse --verify -q HEAD^2 >/dev/null || {
            echo "::error::expected the pull request's merge commit at HEAD; cannot tell what it changes"
            exit 1
          }
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          run=$(python3 tools/render-lab/real_scope.py --workflow .github/workflows/render-real.yml \
                  --app "$APP" --changed "$RUNNER_TEMP/changed.txt")
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "Nothing this pull request changes reaches $APP's rendering (tools/render-lab/real_scope.py), so its real documents were not rendered: they would render as on main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.scope.outputs.run == 'true'

      - name: Build render-lab image
        if: steps.scope.outputs.run == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab

      - name: Cache cargo
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v6.1.0  # zizmor: ignore[cache-poisoning] false positive: the build-push-action step only loads the render-lab image into the local docker with load: true and publishes nothing
        with:
          path: |
            ~/.cache/render-lab-cargo
            target
          key: render-lab-cargo-${{ matrix.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            render-lab-cargo-${{ matrix.app }}-
            render-lab-cargo-

      - name: Cache the real documents
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v6.1.0  # zizmor: ignore[cache-poisoning] false positive: the build-push-action step only loads the render-lab image into the local docker with load: true and publishes nothing
        with:
          path: .cache/render-lab-corpus
          key: render-lab-corpus-${{ matrix.app }}-${{ hashFiles('tools/render-lab/real_corpus/manifest.json') }}
          restore-keys: |
            render-lab-corpus-${{ matrix.app }}-

      # Main's last pixel scores (pixel_board.py), so the scoreboard below
      # shows what this run moved; none yet is fine.
      - name: Main's pixel scores
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p render-lab-out
          python3 tools/render-lab/pixel_board.py previous --key "real-${{ matrix.app }}" \
            --repo "${GITHUB_REPOSITORY}" > render-lab-out/pixel-previous.json || echo '{}' > render-lab-out/pixel-previous.json

      - name: Run render lab on the real documents
        if: steps.scope.outputs.run == 'true'
        id: run
        env:
          CONTAINER_ENGINE: docker
          RENDER_LAB_CORPUS: real
        run: tools/render-lab/run.sh --app ${{ matrix.app }}

      - name: Job summary
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          cat render-lab-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          { echo; cat render-lab-out/pixel-scoreboard.md; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # Tells `publish` the ratchet passed, so it may sync issues.
      - name: Mark a passing run
        if: steps.scope.outputs.run == 'true' && steps.run.outcome == 'success'
        run: touch render-lab-out/run-ok 2>/dev/null || sudo touch render-lab-out/run-ok

      - name: Upload report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: render-real-${{ matrix.app }}
          path: |
            render-lab-out/report.html
            render-lab-out/summary.json
            render-lab-out/summary.md
            render-lab-out/scorecard.json
            render-lab-out/pixel-scoreboard.md
            render-lab-out/pixel-*.json
            render-lab-out/fixtures/manifest.json
            render-lab-out/run-ok
            render-lab-out/${{ matrix.app }}/*/*.png
            render-lab-out/${{ matrix.app }}/*/*.log
          retention-days: 14

  # The scoreboards and the issue sync, with the write token `lab` does not
  # get (#1678). Only from main (schedule, or a dispatch on main), never on
  # a pull request, so the code it checks out is main's.
  publish:
    name: Publish real-document results (${{ matrix.app }})
    needs: lab
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: render-real-${{ matrix.app }}
          path: render-lab-out

      # The ranked pixel scoreboard, one pinned issue per app: the queue to
      # fix from the top of, whatever the ratchet said.
      - name: Publish the pixel scoreboard
        if: hashFiles('render-lab-out/pixel-scores.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 tools/render-lab/pixel_board.py publish
          render-lab-out/pixel-scoreboard.md render-lab-out/pixel-scores.json
          --key "real-${{ matrix.app }}" --title "Pixel scoreboard: ${{ matrix.app }} real documents"
          --repo "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # One `render-real` issue per document that is not green, closed
      # when it turns green; only from a run whose ratchet passed, so a
      # regression is a failed run, not an issue.
      - name: Sync render-real issues
        if: always() && hashFiles('render-lab-out/run-ok') != '' && hashFiles('render-lab-out/summary.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 tools/render-lab/sync_issues.py render-lab-out/summary.json --mode real
          --repo "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
