name: Mandelbrot

# Mandelbrot (mandelbrot/) is the suite's Matrix client, a Fractal fork. It is
# its own Cargo workspace (docs/SUITE-INTEGRATION.md): matrix-sdk and LiveKit
# stay out of the suite's lockfile. It builds against the GNOME 51 runtime,
# using the Flatpak manifest it ships.

on:
  push:
    branches: [main]
    paths:
      - 'mandelbrot/**'
      - '.github/workflows/mandelbrot.yml'
  pull_request:
    paths:
      - 'mandelbrot/**'
      - '.github/workflows/mandelbrot.yml'
  workflow_dispatch:

# A newer push to the same pull request supersedes the queued or running one. Main
# and a dispatch always finish.
concurrency:
  group: mandelbrot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  matrixrtc:
    name: Mandelbrot MatrixRTC engine (clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: clippy
        run: cargo clippy --manifest-path mandelbrot/matrixrtc/Cargo.toml --all-targets -- -D warnings
      - name: tests
        run: cargo test --manifest-path mandelbrot/matrixrtc/Cargo.toml

  flatpak:
    name: Mandelbrot Flatpak build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The image ships its SDK in /var/lib/flatpak, in the image's own
      # layers. When Flathub has a newer SDK, flatpak-builder updates it in
      # place, and on some runners' overlayfs that fails with "Invalid
      # cross-device link" before anything is built. A copy in the
      # container's writable layer updates normally.
      - name: Make the image's Flatpak installation writable
        run: |
          set -euo pipefail
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: mandelbrot/org.tunaos.mandelbrot.json
          build-bundle: false
          cache: false
