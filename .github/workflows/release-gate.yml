name: Release gate

on:
  pull_request:
    paths:
      - 'flatpak/**'
      - 'flathub/**'
      - 'po/**'
      - 'scripts/release_gate.py'
      - 'tools/release/**'
      - 'docs/RELEASE.md'
      - 'Cargo.lock'
      - '.github/workflows/release-gate.yml'
      # The modules whose line ceilings this gate enforces. Without them the
      # gate never ran on a pull request that grew one, which is how
      # tables/src/window.rs crossed 2300 at 5c7f436 and stayed over on main
      # until #594. Derived from scripts/release_gate.py's module_ceilings by
      # tests/test_release_gate.py, so adding a ceiling without a trigger
      # fails rather than going quiet.
      - 'letters/src/window.rs'
      - 'tables/src/window.rs'
      - 'decks/src/window.rs'
      - 'suite-common/src/lib.rs'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set reproducibility timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct \"$GITHUB_SHA\")" >> "$GITHUB_ENV"
      - name: Install release validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream desktop-file-utils gettext libglib2.0-bin
      - name: Validate source release contract
        run: python3 scripts/release_gate.py
      - name: Validate desktop files, schemas, translations, and AppStream
        run: |
          set -euo pipefail
          schema_dir="$(mktemp -d)"
          for app in letters tables decks; do
            desktop-file-validate "flatpak/org.tunaos.${app}.desktop"
            # glib-compile-schemas only accepts a directory, so validate each
            # schema in isolation inside a scratch directory.
            rm -f "${schema_dir}"/*.gschema.xml
            cp "flatpak/org.tunaos.${app}.gschema.xml" "${schema_dir}/"
            glib-compile-schemas --strict --dry-run "${schema_dir}"
            appstreamcli validate --no-net "flatpak/org.tunaos.${app}.metainfo.xml"
          done
          msgfmt --check --check-accelerators=_ -o /dev/null po/gtk-office-suite.pot
      - name: Produce release input checksums
        run: |
          mkdir -p release-evidence
          find flatpak flathub po -type f -print0 | sort -z | xargs -0 sha256sum > release-evidence/release-inputs.sha256
          sha256sum Cargo.lock scripts/release_gate.py docs/RELEASE.md >> release-evidence/release-inputs.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-contract-${{ github.sha }}
          path: release-evidence/release-inputs.sha256
          retention-days: 90

  # Binary reproducibility (docs/readiness-2026-09/release.md): the same
  # commit built twice from clean, on two separate runners, must give
  # byte-identical release binaries. The checksums above prove which
  # inputs went in; this proves the build does not add anything of its
  # own (a timestamp, a path, an unordered map). Measured before it went
  # in: two clean release builds of Letters in different target
  # directories gave the same sha256.
  reproducible-build:
    name: Reproducible build (${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        run: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install GTK4 + libadwaita dev libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # No cache on purpose: each run starts from nothing.
      - name: Build the release binaries from clean
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          rustc --version --verbose
          cargo build --release --locked --bin letters --bin tables --bin decks
          mkdir -p repro
          (cd target/release && sha256sum letters tables decks) > "repro/${{ matrix.run }}.sha256"
          cat "repro/${{ matrix.run }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducible-build-${{ matrix.run }}
          path: repro/${{ matrix.run }}.sha256
          retention-days: 90

  reproducible-compare:
    name: Reproducible build (compare)
    needs: reproducible-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: reproducible-build-*
          path: repro
          merge-multiple: true
      - name: The two clean builds are byte-identical
        run: |
          cat repro/first.sha256 repro/second.sha256
          if diff -u repro/first.sha256 repro/second.sha256; then
            echo "### Reproducible build: identical" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::two clean builds of the same commit produced different binaries"
            exit 1
          fi
          { echo '```'; cat repro/first.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducible-build-${{ github.sha }}
          path: repro/
          retention-days: 90

  # The locked source archive a release's offline builds start from
  # (tools/release/source_archive.sh): the tracked files and every crate
  # Cargo.lock names, vendored. Reproducible, so its sha256 names it.
  source-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Build the archive
        run: tools/release/source_archive.sh HEAD source-archive | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-archive
          path: source-archive
          retention-days: 30

  # What Flathub builds: no network, from the locked archive, on each
  # architecture the apps publish for (x86_64 and aarch64, as
  # publish-flatpak.yml builds them). The manifests are derived from the
  # development ones (tools/release/flathub_manifests.py), so this is the
  # development build, offline.
  offline-flatpak:
    needs: source-archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-archive
          path: source-archive
      - name: Derive the offline manifests
        run: |
          archive="$(ls "$PWD"/source-archive/*.tar.gz)"
          sha="$(cut -d' ' -f1 "$archive.sha256")"
          python3 tools/release/flathub_manifests.py "$archive" "$sha" flathub-build
      - name: Build Letters offline
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flathub-build/org.tunaos.letters.json
          cache: false
          upload-artifact: false
          bundle: org.tunaos.letters-offline-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}

  # The core crates' tests on aarch64 itself, not just a build for it: the
  # readers, writers and layout run where the published aarch64 bundle runs.
  aarch64-tests:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install GTK4 + libadwaita dev libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@bb0282cdd6e41599bc8dfa5fc712ebe9e27cfd8c # nextest
        with:
          tool: nextest
      - name: Core crates' tests on aarch64
        run: cargo nextest run --locked --no-fail-fast -p letters-core -p tables-core -p decks-core
