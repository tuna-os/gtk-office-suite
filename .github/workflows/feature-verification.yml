name: Feature verification video

# Runs real GUI journeys in the test container, records each one, and
# writes the result — with the clips playable inline — into the pull
# request's own description.
#
# Why: a roadmap item is "done" when the application does the thing, not
# when a unit test of a model passes. This produces that evidence as a
# by-product of a test run, so what the description shows is exactly what
# was asserted, on the same display, in the same run.
#
# It is opt-in per pull request (add the `verify-video` label) because a
# recorded journey run costs several minutes; the deterministic smoke
# gate in gui-tests.yml still runs on every push.

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      journey:
        description: 'pytest selection, e.g. "test_smoke.py -k Letters"'
        required: false
        default: 'test_smoke.py'
      pr:
        description: 'Pull request number to write the evidence into (optional)'
        required: false
        default: ''

concurrency:
  group: feature-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fork pull requests have a read-only token: they cannot pull a private
  # package, publish media, or comment. Skipping with a reason is honest;
  # a half-run that silently posts nothing is not.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$SAME_REPO" != "true" ]; then
            echo "Fork pull request: skipping (no token to publish evidence)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$LABELS" | grep -q '"verify-video"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Label 'verify-video' not present: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is a main-branch artifact (gui-container.yml). Building
      # it here as a fallback means the very first run of this workflow
      # works before that one has ever published.
      - id: resolve
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          ref="ghcr.io/${REPOSITORY}/gui-test:main"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Using published image $ref"
          else
            echo "No published image yet; building and publishing $ref"
            docker build -t "$ref" -f tests/gui/container/Containerfile tests/gui/container
            docker push "$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  record:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.ref }}
      # GTK and Xvfb share memory through /dev/shm; the container default
      # of 64MB is enough to make rendering fail in ways that look like
      # application bugs.
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Build app binaries
        run: cargo build --bin letters --bin tables --bin decks

      - name: Run recorded journeys
        id: journeys
        env:
          JOURNEY: ${{ github.event.inputs.journey || 'test_smoke.py' }}
          GUI_TEST_VIDEO: all
          GUI_TEST_VIDEO_DIR: ${{ github.workspace }}/tests/gui/videos
        # $JOURNEY is deliberately unquoted: it is a pytest argument list.
        # It is passed through the environment rather than interpolated
        # into the script, so it cannot inject shell commands.
        run: tests/gui/run_gui_tests.sh $JOURNEY

      - name: Collect evidence
        if: always()
        env:
          JOURNEY: ${{ github.event.inputs.journey || 'test_smoke.py' }}
        run: |
          python3 tests/gui/collect_evidence.py tests/gui/videos \
            --out evidence --title "Feature verification: $JOURNEY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-verification
          path: |
            evidence
            tests/gui/failure_artifacts
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: record
    # A cancelled record job is a superseded run, not a result: the
    # concurrency group cancels the older run the moment a newer event (a
    # label, a push) starts one. Publishing from it wrote "no evidence
    # produced" into the pull-request body, which is a false statement
    # about the change — the newer run happened to overwrite it, but a
    # newer run that failed would have left the lie standing.
    if: always() && (needs.record.result == 'success' || needs.record.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push clips to the ci-evidence branch
      pull-requests: write   # write the evidence block into the PR body
    steps:
      - uses: actions/checkout@v7

      # A record job that died before uploading (build failure, container
      # pull failure) still gets a block saying so — silence would read
      # as "not run yet".
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: feature-verification
          path: downloaded

      # GitHub renders an image in a body only from a URL it can fetch,
      # and there is no API for attaching one. An orphan branch holding
      # just the clips is the smallest thing that works, and keeping only
      # the newest run per pull request stops it from growing without
      # bound.
      - name: Publish clips to the ci-evidence branch
        id: media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail
          if [ ! -d downloaded/evidence ] || [ -z "$(ls -A downloaded/evidence 2>/dev/null)" ]; then
            echo "No evidence to publish."
            exit 0
          fi
          case "$PR" in
            ''|*[!0-9]*) slot="pr-manual" ;;   # a typed input is not a path
            *) slot="pr-$PR" ;;
          esac
          work="$(mktemp -d)"
          git clone --depth 1 --branch ci-evidence \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$work" 2>/dev/null || {
              git clone --depth 1 \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
              git -C "$work" checkout --orphan ci-evidence
              git -C "$work" rm -rq --cached . || true
              rm -rf "$work"/* 2>/dev/null || true
              printf '%s\n' \
                '# CI evidence' '' \
                'Recorded GUI journeys shown in pull request descriptions.' \
                'Generated by .github/workflows/feature-verification.yml; not source.' \
                > "$work/README.md"
            }
          rm -rf "${work:?}/${slot}"
          mkdir -p "$work/$slot/${GITHUB_RUN_ID}"
          cp downloaded/evidence/*.gif downloaded/evidence/*.mp4 \
             "$work/$slot/${GITHUB_RUN_ID}/" 2>/dev/null || true
          git -C "$work" config user.name "gui-evidence-bot"
          git -C "$work" config user.email "actions@github.com"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git -C "$work" commit -qm "evidence: $slot run ${GITHUB_RUN_ID}"
            git -C "$work" push -q origin ci-evidence
          fi
          echo "base=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-evidence/${slot}/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Build comment body
        env:
          JOURNEY: ${{ github.event.inputs.journey || 'test_smoke.py' }}
          MEDIA_BASE: ${{ steps.media.outputs.base }}
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f downloaded/evidence/evidence.json ]; then
            python3 tests/gui/pr_comment.py downloaded/evidence/evidence.json \
              --media-base "$MEDIA_BASE" --journey "$JOURNEY" --out comment.md
          else
            reason="The recording job finished as \`$RECORD_RESULT\` without an"
            reason="$reason evidence bundle, so there is nothing to show. That is a"
            reason="$reason harness result, not a verdict about this change."
            reason="$reason See the [workflow run]($RUN_URL)."
            python3 tests/gui/pr_comment.py --journey "$JOURNEY" \
              --no-evidence-reason "$reason" --out comment.md
          fi
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # Into the pull-request body, not a comment. The body is what a
      # reviewer reads first and what the merge commit quotes; evidence
      # buried in a comment thread is evidence nobody opens.
      #
      # Three steps rather than one so the splice — the part that can
      # silently eat someone's description — is done by
      # `pr_comment.splice`, which has unit tests
      # (tests/test_gui_evidence.py). The API calls stay in
      # github-script, which is all they are good for.
      - name: Read the current pull-request body
        if: github.event.pull_request.number || github.event.inputs.pr
        uses: actions/github-script@v7
        env:
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR),
            });
            fs.writeFileSync('current_body.md', pr.body || '');

      # `comment.md` is written above in both cases — with evidence, or
      # with the "no evidence produced" note — so this needs no branch.
      - name: Splice the evidence into it
        if: github.event.pull_request.number || github.event.inputs.pr
        run: |
          python3 tests/gui/pr_comment.py --block comment.md \
            --splice-into current_body.md --out new_body.md

      - name: Write it back
        if: github.event.pull_request.number || github.event.inputs.pr
        uses: actions/github-script@v7
        env:
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('new_body.md', 'utf8');
            if (body === fs.readFileSync('current_body.md', 'utf8')) {
              core.info('Evidence block unchanged.');
              return;
            }
            await github.rest.pulls.update({
              ...context.repo, pull_number: Number(process.env.PR), body,
            });
            core.info('Evidence block written into the pull-request body.');
