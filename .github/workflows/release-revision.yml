name: Release revision

# #313: "nightly-only execution must not certify a different release
# revision."
#
# The LibreOffice oracle and the parity corpus need LibreOffice installed,
# so they do not run at every revision — nightly.yml runs them daily
# against whatever main was at 05:00, plus on pull requests that touch
# format or model code. A tag cut at any other time inherits a verdict
# reached on different code, and nothing noticed: when this was written the
# last successful nightly had certified b92a82e while main was five merges
# further on.
#
# Tags only, deliberately. This asks "is the expensive evidence current for
# what we are about to publish?", which is a question only a release has.
# Pull requests get the structural ledger checks from ci.yml.
#
# docs/RELEASE.md says how to satisfy it: dispatch nightly.yml at the
# release commit and record the revision it passed at. The fix is never to
# lower a claim's status or relax the rule.
on:
  push:
    tags: ['v*']
  # Called by publish-flatpak.yml so the check runs *before* the Flatpaks are
  # pushed. On its own the tag trigger only failed beside the publish: a tag
  # whose ledger this job refused to certify was published anyway, which made
  # the refusal a report rather than a gate.
  workflow_call:
    inputs:
      revision:
        description: 'Revision to test the ledger against (default: this ref)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      revision:
        description: 'Revision to test the ledger against (default: this ref)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  scheduled-evidence-is-current:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuse to certify a release with stale scheduled evidence
        env:
          REQUESTED: ${{ inputs.revision }}
        run: |
          revision="${REQUESTED:-$GITHUB_SHA}"
          echo "Validating the ledger against ${revision}"
          python3 conformance/validate_capabilities.py \
            --lanes conformance/lanes.json \
            --release-revision "$revision"

  # C7 (#1207): run the release-critical Rust evidence at the revision being
  # released and refuse it when any of it was skipped, failed or never ran.
  # The PR lane checks C4 for every verified claim on every revision, but
  # nothing tied that to a release: a tag cut from a commit whose lane was
  # red, or never ran, published anyway. This is the same workspace run as
  # ci.yml's `test` job (so the ids match the ledger's), at the release
  # revision, feeding validate_capabilities.py --release-critical. The
  # journeys' half runs here too: the release-critical capabilities' GUI
  # tests, at the same revision, so a release whose journey failed, was
  # skipped or never ran is refused like one whose Rust test was.
  release-critical-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install GTK4 + libadwaita dev libraries, Xvfb and poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev xvfb poppler-utils
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@2eb6de229bc778f7df20e106e4b34e9a364c73e6 # nextest
        with:
          tool: nextest
      - name: Run the workspace tests at the release revision
        run: scripts/with-display.sh cargo nextest run --workspace --profile ci --no-fail-fast
      - name: Build the app binaries the journeys drive
        run: cargo build --bin letters --bin tables --bin decks
      - name: Install GUI test dependencies
        run: |
          sudo apt-get install -y -qq xvfb dbus at-spi2-core matchbox-window-manager xdotool \
            x11-utils python3-dogtail python3-pytest python3-pil python3-requests
          python3 -m pip install --break-system-packages mss
      - name: Run the release-critical journeys at the release revision
        if: always()
        run: |
          # Every journey a release-critical capability cites, at any layer:
          # an a11y journey left out here would be missing below, and the
          # check would refuse the release for a test it never ran.
          python3 - > journeys.txt <<'PY'
          import json
          ledger = json.load(open("conformance/capabilities.json"))
          journeys = {}
          for feature in ledger["features"]:
              if feature.get("release_critical"):
                  for tests in feature.get("evidence", {}).values():
                      for test in tests:
                          if test.startswith("tests/gui/"):
                              journeys[test.removeprefix("tests/gui/")] = None
          print("\n".join(journeys))
          PY
          if [ ! -s journeys.txt ]; then
            echo "No release-critical capability names a journey."
            exit 0
          fi
          # A failing journey fails this step; the next step still runs
          # (always()) and names which release-critical test it was.
          tests/gui/run_gui_tests.sh $(cat journeys.txt) \
            --junitxml="$GITHUB_WORKSPACE/gui-junit.xml"
      # --every-release-critical-result: this job runs every lane marked
      # runs_on_candidate, so no release-critical test is another lane's
      # business — one missing from these reports never ran at this
      # revision and refuses the release (SH-001). The inventory is stamped
      # with the commit actually checked out and must match it.
      - name: Refuse a release whose release-critical evidence did not pass
        if: always()
        run: |
          revision="$(git rev-parse HEAD)"
          gui=()
          if [ -f gui-junit.xml ]; then gui=(--pytest-junit "tests/gui=gui-junit.xml"); fi
          python3 conformance/collect_test_inventory.py \
            --junit "=target/nextest/ci/junit.xml" "${gui[@]}" --revision "$revision" \
            --out rust-inventory.json --results-out rust-results.json
          python3 conformance/validate_capabilities.py \
            --lanes conformance/lanes.json --lane test \
            --collected rust-inventory.json --results rust-results.json \
            --candidate "$revision" \
            --release-critical --every-release-critical-result
      # The JUnit and the ledger's verdicts on it, kept for the release's
      # evidence bundle (release-evidence.yml).
      - name: Keep the release-critical evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-critical-evidence
          path: |
            target/nextest/ci/junit.xml
            gui-junit.xml
            rust-inventory.json
            rust-results.json
          retention-days: 90
          if-no-files-found: warn
