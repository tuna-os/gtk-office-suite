name: Render parity

# Compares what the editors draw on screen against LibreOffice's rendering
# of the same single-feature fixtures (docs/RENDER-PARITY-ROADMAP.md).
#
#   Tier A  in-app render dump through GTK's own GSK pipeline (every run)
#   Tier B  the app under GTK Broadway, screenshotted by headless Chromium
#           (every run)
#   Tier C  the shipped Flatpak in a GNOME Wayland VM (nightly + manual)
#
# Everything an agent or reviewer needs comes out of this workflow, with
# no human looking at screenshots:
#   - the job summary and a sticky PR comment list regressed/improved
#     fixtures;
#   - the ratchet fails a PR that makes any fixture worse, or that makes
#     one better without committing tools/render-lab/baseline.json;
#   - on main, every non-green fixture has exactly one `render-parity`
#     issue with a CI-checkable acceptance criterion (sync_issues.py), and
#     issues close themselves when their fixture goes green;
#   - the full side-by-side report is an artifact on every run.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      vm:
        description: Also run Tier C (Flatpak in a GNOME VM)
        type: boolean
        default: false

concurrency:
  group: render-parity-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per app, in parallel: each builds only its own app, renders its
  # fixtures, and gates on its own verdicts (the ratchet in run.sh). The
  # combine job below turns their outputs into one report, PR comment,
  # proposed baseline and issue sync.
  lab:
    name: Render lab (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # On top of the published GUI test image (gui-container.yml builds,
      # verifies and pushes it from main). A locally built base would be
      # invisible to buildx's docker-container builder.
      - name: Build render-lab image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab
          cache-to: type=gha,mode=max,scope=render-lab

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/render-lab-cargo
            target
          key: render-lab-cargo-${{ matrix.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            render-lab-cargo-${{ matrix.app }}-
            render-lab-cargo-

      - name: Run render lab
        env:
          CONTAINER_ENGINE: docker
        run: tools/render-lab/run.sh --app ${{ matrix.app }}

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: render-lab-${{ matrix.app }}
          path: |
            render-lab-out/${{ matrix.app }}/*/*.png
            render-lab-out/${{ matrix.app }}/*/*.log
            render-lab-out/${{ matrix.app }}/*/geom.json
          retention-days: 14

  report:
    name: Tiers A+B vs LibreOffice
    needs: lab
    # Not on a cancelled run: a newer push cancels the labs part-way, and
    # comparing what they had captured by then reported every fixture they
    # never reached as a regression to "missing" (PR #1222, 19 Letters
    # fixtures). A lab that *failed* is still compared and reported.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build render-lab image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab

      # upload-artifact strips the paths' common prefix, so each app's
      # captures arrive as <fixture>/... and must be put back under <app>/.
      # Merging them into one directory lost the app level, the compare
      # found nothing, and the report came out empty but green.
      #
      # Each app is downloaded by name straight into render-lab-out/<app>.
      # A `pattern:` download is not safe here: since download-artifact v5,
      # a pattern that matches exactly one artifact is extracted flat into
      # `path` with no <artifact-name>/ level, so on a run where only one lab
      # uploaded, its fixtures would land at the top and the app would drop
      # out of the report. A lab that uploaded nothing leaves its download
      # failed (continue-on-error) and is named by the check below.
      - name: Download captures (letters)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: render-lab-letters
          path: render-lab-out/letters

      - name: Download captures (tables)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: render-lab-tables
          path: render-lab-out/tables

      - name: Download captures (decks)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: render-lab-decks
          path: render-lab-out/decks

      - name: Check every app's captures arrived
        run: |
          mkdir -p render-lab-out
          ls render-lab-out
          for app in letters tables decks; do
            n=$(find "render-lab-out/$app" -name '*.png' 2>/dev/null | wc -l)
            echo "$app: $n captures"
            [ "$n" -gt 0 ] || echo "::warning::no render-lab captures for $app; its lab job did not upload, so it is missing from this report"
          done

      # The whole-suite report, and the baseline this run would lock in: an
      # agent or reviewer can take `baseline.proposed.json` from the
      # artifact instead of re-running the lab locally.
      - name: Compare all apps
        id: compare
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace render-lab bash -c '
            python3 tools/render-lab/fixtures.py render-lab-out/fixtures >/dev/null &&
            python3 tools/render-lab/edit_journeys.py render-lab-out/fixtures --manifest-only &&
            cp tools/render-lab/baseline.json render-lab-out/baseline.proposed.json &&
            python3 tools/render-lab/compare.py render-lab-out/fixtures render-lab-out \
              --baseline render-lab-out/baseline.proposed.json --update-baseline >/dev/null &&
            python3 tools/render-lab/compare.py render-lab-out/fixtures render-lab-out \
              --baseline tools/render-lab/baseline.json'

      - name: Job summary
        if: always()
        run: cat render-lab-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always()
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: render-parity-report
          path: |
            render-lab-out/report.html
            render-lab-out/summary.json
            render-lab-out/summary.md
            render-lab-out/scorecard.json
            render-lab-out/baseline.proposed.json
            render-lab-out/*/*/*.png
            render-lab-out/*/*/*.log
          retention-days: 14

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.upload.outputs.artifact-url }}
        run: |
          [ -f render-lab-out/summary.md ] || exit 0
          { echo '<!-- render-parity-comment -->'; cat render-lab-out/summary.md
            echo; echo "Side-by-side report (LibreOffice | ours | diff), with \`baseline.proposed.json\`: ${REPORT}"; } > comment.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- render-parity-comment -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Sync render-parity issues
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.lab.result == 'success' && hashFiles('render-lab-out/summary.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 tools/render-lab/sync_issues.py render-lab-out/summary.json
          --repo "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # Export parity (docs/EXPORT-PARITY-SPEC.md): each app's own PDF export of
  # the opted-in fixtures (`export: true` in the manifest, docx/pptx only)
  # rasterized like the LibreOffice reference and scored with the same
  # metrics. Same shape as the screenshot jobs above: one lab job per app,
  # then a combine job with the proposed baseline, a sticky PR comment and
  # issue sync on main. The verdicts ratchet against the SEPARATE
  # tools/render-lab/baseline-export.json, never baseline.json.
  export-lab:
    name: Export lab (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Tables has had an --export-pdf hook since 17eac2b and its fixtures
        # are opted in, but it was never added here: its baseline verdicts
        # came from local runs and nothing in CI exported a Tables PDF, so
        # the issue sync filed every one of them as "missing" (#1194).
        app: [letters, decks, tables]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build render-lab image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab
          cache-to: type=gha,mode=max,scope=render-lab

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/render-lab-cargo
            target
          key: render-lab-export-cargo-${{ matrix.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            render-lab-export-cargo-${{ matrix.app }}-
            render-lab-cargo-${{ matrix.app }}-
            render-lab-cargo-

      - name: Run export lab
        env:
          CONTAINER_ENGINE: docker
        run: tools/render-lab/run-export.sh --app ${{ matrix.app }}

      - name: Upload export captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: export-lab-${{ matrix.app }}
          path: |
            render-lab-out/${{ matrix.app }}/*/ours-*.png
            render-lab-out/${{ matrix.app }}/*/lo-*.png
            render-lab-out/${{ matrix.app }}/*/export.pdf
            render-lab-out/${{ matrix.app }}/*/export.log
          retention-days: 14

  export-report:
    name: Export PDF vs LibreOffice PDF
    needs: export-lab
    # Not on a cancelled run: a newer push cancels the labs part-way, and
    # comparing what they had captured by then reported every fixture they
    # never reached as a regression to "missing" (PR #1222, 19 Letters
    # fixtures). A lab that *failed* is still compared and reported.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build render-lab image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab

      - name: Download export captures (letters)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: export-lab-letters
          path: render-lab-out/letters

      - name: Download export captures (decks)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: export-lab-decks
          path: render-lab-out/decks

      - name: Download export captures (tables)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: export-lab-tables
          path: render-lab-out/tables

      - name: Check every app's export captures arrived
        run: |
          mkdir -p render-lab-out
          ls render-lab-out
          for app in letters decks tables; do
            n=$(find "render-lab-out/$app" -name 'ours-*.png' 2>/dev/null | wc -l)
            echo "$app: $n export captures"
            [ "$n" -gt 0 ] || echo "::warning::no export captures for $app; its export-lab job did not upload, so it is missing from this report"
          done

      # The export verdicts this run would lock in: an agent or reviewer
      # takes `baseline-export.proposed.json` from the artifact instead of
      # re-running the lab locally — after looking at the images.
      - name: Compare exports
        id: compare
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace render-lab bash -c '
            python3 tools/render-lab/fixtures.py render-lab-out/fixtures >/dev/null &&
            cp tools/render-lab/baseline-export.json render-lab-out/baseline-export.proposed.json &&
            python3 tools/render-lab/export_compare.py render-lab-out/fixtures render-lab-out \
              --baseline render-lab-out/baseline-export.proposed.json --update-baseline >/dev/null &&
            python3 tools/render-lab/export_compare.py render-lab-out/fixtures render-lab-out \
              --baseline tools/render-lab/baseline-export.json'

      - name: Job summary
        if: always()
        run: cat render-lab-out/summary-export.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload export report
        if: always()
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: export-parity-report
          path: |
            render-lab-out/export-report.html
            render-lab-out/summary-export.json
            render-lab-out/summary-export.md
            render-lab-out/scorecard-export.json
            render-lab-out/baseline-export.proposed.json
            render-lab-out/*/*/ours-*.png
            render-lab-out/*/*/lo-*.png
            render-lab-out/*/*/diff-export-*.png
            render-lab-out/*/*/export.pdf
            render-lab-out/*/*/export.log
          retention-days: 14

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.upload.outputs.artifact-url }}
        run: |
          [ -f render-lab-out/summary-export.md ] || exit 0
          { echo '<!-- export-parity-comment -->'; cat render-lab-out/summary-export.md
            echo; echo "Side-by-side export report (LibreOffice PDF | our PDF | diff), with \`baseline-export.proposed.json\`: ${REPORT}"; } > export-comment.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- export-parity-comment -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@export-comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file export-comment.md
          fi

      - name: Sync export-parity issues
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.export-lab.result == 'success' && hashFiles('render-lab-out/summary-export.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 tools/render-lab/sync_issues.py render-lab-out/summary-export.json --mode export
          --repo "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  flatpak:
    name: Flatpak bundle (${{ matrix.app }})
    if: github.event_name == 'schedule' || inputs.vm
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    strategy:
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: ${{ matrix.app }}.flatpak
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          cache-key: render-lab-flatpak-${{ matrix.app }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-${{ matrix.app }}
          path: ${{ matrix.app }}.flatpak
          retention-days: 3

  # The last release's bundles, built from its tag, for the upgrade check
  # (#1209): a user upgrading keeps their settings and recovery checkpoints.
  # Releases carry no bundles of their own to download, so they are built
  # here; the cache is keyed on the tag, so a release is built once.
  flatpak-prior:
    name: Prior-release bundle (${{ matrix.app }})
    if: github.event_name == 'schedule' || inputs.vm
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    strategy:
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: tag
        name: The last release's tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git checkout -q "$tag"
          # The release's own metainfo can name an older version (v2.1.0's
          # latest <release> was 1.1.0), so the report names the tag.
          echo "$tag" > prior-tag.txt
          echo "Prior release: $tag"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: ${{ matrix.app }}.flatpak
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          cache-key: render-lab-flatpak-prior-${{ matrix.app }}-${{ steps.tag.outputs.tag }}
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prior-bundle-${{ matrix.app }}
          path: |
            ${{ matrix.app }}.flatpak
            prior-tag.txt
          retention-days: 3

  vm:
    name: Tier C (Flatpak in a GNOME VM)
    needs: [flatpak, flatpak-prior]
    # A prior release that fails to build leaves the upgrade check
    # unreported (and failing), not the rest of Tier C unrun.
    if: ${{ !cancelled() && needs.flatpak.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Gating: Tier C ran green on main every night for a week (2026-10-03
    # to 2026-10-09, runs 37112609169 onward, #1199), so a failure here
    # fails the run instead of only showing in the report.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils python3-pil

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      # Not fatal when missing: the upgrade check then reports every app
      # unchecked, and the rest of Tier C still runs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: prior-bundle-*
          path: prior-bundles
          merge-multiple: true

      - name: Cache prepared guest image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vm-work
          key: render-lab-vm-${{ hashFiles('tools/render-lab/vm/prepare.sh', 'tools/render-lab/vm/user-data') }}

      - name: Prepare guest (first run only)
        run: '[ -f vm-work/guest.qcow2 ] || tools/render-lab/vm/prepare.sh vm-work'

      - name: Fixtures and LibreOffice reference
        run: |
          docker build -t render-lab -f tools/render-lab/Containerfile \
            --build-arg BASE=ghcr.io/${GITHUB_REPOSITORY}/gui-test:main tools/render-lab
          docker run --rm -v "$PWD:/workspace" -w /workspace render-lab bash -c \
            'python3 tools/render-lab/fixtures.py render-lab-out/fixtures && python3 tools/render-lab/lo_render.py render-lab-out/fixtures render-lab-out'
          # The container wrote render-lab-out as root; the VM capture runs
          # as the runner and writes its screenshots there (#1199: the first
          # run to get that far failed on a PermissionError).
          sudo chown -R "$(id -u):$(id -g)" render-lab-out

      - name: Capture in the VM
        run: tools/render-lab/vm/run.sh vm-work bundles render-lab-out/fixtures render-lab-out prior-bundles

      - name: Compare
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace render-lab \
            python3 tools/render-lab/compare.py render-lab-out/fixtures render-lab-out --baseline tools/render-lab/baseline.json
          cat render-lab-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      # The installed Flatpak used the way a desktop uses it (#1209): opened
      # from the file manager, saved through the document portal.
      - name: Installed Flatpak checks
        if: always()
        run: |
          set -o pipefail
          python3 tools/render-lab/installed_check.py render-lab-out/installed.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Upgrading from the last release (#1209): its settings and an
      # interrupted recovery checkpoint carried over to the candidate.
      - name: Upgrade checks
        if: always()
        run: |
          set -o pipefail
          python3 tools/render-lab/upgrade_check.py render-lab-out/upgrade.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload VM report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: render-parity-vm-report
          path: |
            render-lab-out/report.html
            render-lab-out/summary.*
            render-lab-out/*/*/*.png
            render-lab-out/*/*/*.log
            render-lab-out/installed*
            render-lab-out/upgrade*
            vm-work/*.log
          retention-days: 14
