name: Render parity

# Compares what the editors draw on screen against LibreOffice's rendering
# of the same single-feature fixtures (docs/RENDER-PARITY-ROADMAP.md).
#
#   Tier A  in-app render dump through GTK's own GSK pipeline (every run)
#   Tier B  the app under GTK Broadway, screenshotted by headless Chromium
#           (every run)
#   Tier C  the shipped Flatpak in a GNOME Wayland VM (nightly + manual)
#
# Everything an agent or reviewer needs comes out of this workflow, with
# no human looking at screenshots:
#   - the job summary and a sticky PR comment list regressed/improved
#     fixtures;
#   - the ratchet fails a PR that makes any fixture worse, or that makes
#     one better without committing tools/render-lab/baseline.json;
#   - on main, every non-green fixture has exactly one `render-parity`
#     issue with a CI-checkable acceptance criterion (sync_issues.py), and
#     issues close themselves when their fixture goes green;
#   - the full side-by-side report is an artifact on every run.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      vm:
        description: Also run Tier C (Flatpak in a GNOME VM)
        type: boolean
        default: false

concurrency:
  group: render-parity-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which apps a pull request can change the rendering of: each app's crate
  # and every workspace crate it links (derived from the Cargo manifests),
  # the lockfile, the workspace manifest, the lab and this workflow
  # (tools/render-lab/real_scope.py, the scope render-real.yml uses). Only
  # those apps get lab jobs; a docs-only change starts none, and a
  # Decks-only change does not render Letters and Tables, which would render
  # as on main. Push to main, the schedule and a dispatch render every app.
  scope:
    name: Render scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.scope.outputs.apps }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # On a pull request this is its merge commit; the scope diffs it
          # against its first parent, the base branch it merges into.
          fetch-depth: 2

      - name: Which apps does the change reach?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            source=(--all)
          else
            git rev-parse --verify -q HEAD^2 >/dev/null || {
              echo "::error::expected the pull request's merge commit at HEAD; cannot tell what it changes"
              exit 1
            }
            git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            source=(--changed "$RUNNER_TEMP/changed.txt")
          fi
          apps=$(python3 tools/render-lab/real_scope.py --workflow .github/workflows/render-parity.yml "${source[@]}")
          echo "apps=$apps" | tee -a "$GITHUB_OUTPUT"
          echo "Apps rendered in this run: \`$apps\` (tools/render-lab/real_scope.py)." >> "$GITHUB_STEP_SUMMARY"

  # One job per app in scope, in parallel: each builds only its own app,
  # renders its fixtures, and gates on its own verdicts (the ratchet in
  # run.sh). The combine job below turns their outputs into one report, PR
  # comment, proposed baseline and issue sync, and is the verdict: it runs
  # on every pull request and fails when a lab in scope did not succeed.
  lab:
    name: Render lab (${{ matrix.app }})
    needs: scope
    if: needs.scope.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.scope.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      # On top of the published GUI test image (gui-container.yml builds,
      # verifies and pushes it from main). A locally built base would be
      # invisible to buildx's docker-container builder.
      - name: Build render-lab image
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab
          cache-to: type=gha,mode=max,scope=render-lab

      - name: Cache cargo
        uses: actions/cache@v6.1.0  # zizmor: ignore[cache-poisoning] false positive: the build-push-action step only loads the render-lab image into the local docker with load: true and publishes nothing
        with:
          path: |
            ~/.cache/render-lab-cargo
            target
          key: render-lab-cargo-${{ matrix.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            render-lab-cargo-${{ matrix.app }}-
            render-lab-cargo-

      - name: Run render lab
        env:
          CONTAINER_ENGINE: docker
          APP: ${{ matrix.app }}
        run: tools/render-lab/run.sh --app "$APP"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: render-lab-${{ matrix.app }}
          path: |
            render-lab-out/${{ matrix.app }}/*/*.png
            render-lab-out/${{ matrix.app }}/*/lo-*.txt
            render-lab-out/${{ matrix.app }}/*/*.log
            render-lab-out/${{ matrix.app }}/*/geom.json
          retention-days: 14

  report:
    name: Tiers A+B vs LibreOffice
    needs: [scope, lab]
    # Not on a cancelled run: a newer push cancels the labs part-way, and
    # comparing what they had captured by then reported every fixture they
    # never reached as a regression to "missing" (PR #1222, 19 Letters
    # fixtures). A lab that *failed* is still compared and reported, and
    # then fails this job too; so does a scope job that failed. A lab that
    # was skipped because no app is in scope is not a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read-only: this job runs the pull request's own code (the lab
    # scripts), so it gets no token that can write (#1678). The comment,
    # the scoreboard and the issue sync are posted by `report-post`.
    permissions:
      contents: read
      issues: read
    outputs:
      any: ${{ steps.inscope.outputs.any }}
      skipped: ${{ steps.inscope.outputs.skipped }}
    steps:
      # Which apps this run rendered. None: a pull request that reaches no
      # app's rendering passes here in seconds, with nothing compared.
      - name: Apps in scope
        id: inscope
        env:
          SCOPE: ${{ needs.scope.result }}
          APPS: ${{ needs.scope.outputs.apps }}
        run: |
          if [ "$SCOPE" != success ]; then
            echo "::error::the scope job ended '$SCOPE', so no app's rendering was judged"
            exit 1
          fi
          {
            for app in letters tables decks; do
              echo "$app=$(jq -c --arg app "$app" 'index($app) != null' <<<"$APPS")"
            done
            echo "any=$(jq -c 'length > 0' <<<"$APPS")"
            echo "args=$(jq -r 'map("--app " + .) | join(" ")' <<<"$APPS")"
            echo "skipped=$(jq -r '["letters", "tables", "decks"] - . | join(", ")' <<<"$APPS")"
          } | tee -a "$GITHUB_OUTPUT"
          if [ "$(jq length <<<"$APPS")" -eq 0 ]; then
            mkdir -p render-lab-out
            { echo "## Render parity vs LibreOffice"; echo
              echo "Nothing this pull request changes reaches an app's rendering (tools/render-lab/real_scope.py), so no fixture was rendered: every app would render as on main."
            } > render-lab-out/summary.md
          fi

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
        if: steps.inscope.outputs.any == 'true'

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.inscope.outputs.any == 'true'

      - name: Build render-lab image
        if: steps.inscope.outputs.any == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab

      # upload-artifact strips the paths' common prefix, so each app's
      # captures arrive as <fixture>/... and must be put back under <app>/.
      # Merging them into one directory lost the app level, the compare
      # found nothing, and the report came out empty but green.
      #
      # Each app is downloaded by name straight into render-lab-out/<app>.
      # A `pattern:` download is not safe here: since download-artifact v5,
      # a pattern that matches exactly one artifact is extracted flat into
      # `path` with no <artifact-name>/ level, so on a run where only one lab
      # uploaded, its fixtures would land at the top and the app would drop
      # out of the report. A lab that uploaded nothing leaves its download
      # failed (continue-on-error) and is named by the check below.
      - name: Download captures (letters)
        if: steps.inscope.outputs.letters == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: render-lab-letters
          path: render-lab-out/letters

      - name: Download captures (tables)
        if: steps.inscope.outputs.tables == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: render-lab-tables
          path: render-lab-out/tables

      - name: Download captures (decks)
        if: steps.inscope.outputs.decks == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: render-lab-decks
          path: render-lab-out/decks

      - name: Check every app's captures arrived
        if: steps.inscope.outputs.any == 'true'
        env:
          APPS: ${{ needs.scope.outputs.apps }}
        run: |
          mkdir -p render-lab-out
          ls render-lab-out
          for app in $(jq -r '.[]' <<<"$APPS"); do
            n=$(find "render-lab-out/$app" -name '*.png' 2>/dev/null | wc -l)
            echo "$app: $n captures"
            [ "$n" -gt 0 ] || echo "::warning::no render-lab captures for $app; its lab job did not upload, so it is missing from this report"
          done

      # The report over the apps in scope, and the baseline this run would
      # lock in (merged, so the other apps' verdicts stay as committed): an
      # agent or reviewer can take `baseline.proposed.json` from the
      # artifact instead of re-running the lab locally.
      # Main's last pixel scores (pixel_board.py), so the scoreboard shows
      # what this pull request moved; none yet is fine.
      - name: Main's pixel scores
        if: steps.inscope.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p render-lab-out
          python3 tools/render-lab/pixel_board.py previous --key fixtures \
            --repo "${GITHUB_REPOSITORY}" > render-lab-out/pixel-previous.json || echo '{}' > render-lab-out/pixel-previous.json

      - name: Compare the apps in scope
        if: steps.inscope.outputs.any == 'true'
        id: compare
        env:
          APP_ARGS: ${{ steps.inscope.outputs.args }}
        run: |
          docker run --rm -e APP_ARGS -v "$PWD:/workspace" -w /workspace render-lab bash -c '
            python3 tools/render-lab/fixtures.py render-lab-out/fixtures >/dev/null &&
            python3 tools/render-lab/edit_journeys.py render-lab-out/fixtures --manifest-only &&
            cp tools/render-lab/baseline.json render-lab-out/baseline.proposed.json &&
            python3 tools/render-lab/compare.py render-lab-out/fixtures render-lab-out $APP_ARGS \
              --baseline render-lab-out/baseline.proposed.json --update-baseline >/dev/null &&
            python3 tools/render-lab/compare.py render-lab-out/fixtures render-lab-out $APP_ARGS \
              --baseline tools/render-lab/baseline.json
            status=$?
            # The pixel scoreboard, worst fixture first, whatever the ratchet said.
            python3 tools/render-lab/pixel_diff.py render-lab-out $APP_ARGS --overlay \
              --previous render-lab-out/pixel-previous.json \
              --scoreboard render-lab-out/pixel-scoreboard.md \
              --title "Pixel scoreboard: fixtures" >/dev/null || echo "(pixel scoring failed)"
            exit $status'

      - name: Job summary
        if: always()
        env:
          ANY: ${{ steps.inscope.outputs.any }}
          SKIPPED: ${{ steps.inscope.outputs.skipped }}
        run: |
          # The compare step's container wrote render-lab-out as root; the
          # runner's user cannot append to it until it owns it.
          sudo chown -R "$(id -u):$(id -g)" render-lab-out 2>/dev/null || true
          if [ "$ANY" = true ] && [ -n "$SKIPPED" ] && [ -f render-lab-out/summary.md ]; then
            { echo; echo "Not rendered: $SKIPPED. Nothing this pull request changes reaches them (tools/render-lab/real_scope.py)."; } >> render-lab-out/summary.md
          fi
          # The pixel scoreboard, folded under the verdicts.
          if [ -s render-lab-out/pixel-scoreboard.md ] && [ -f render-lab-out/summary.md ]; then
            { echo; echo "<details><summary>Pixel scoreboard (worst first)</summary>"; echo
              cat render-lab-out/pixel-scoreboard.md; echo; echo "</details>"; } >> render-lab-out/summary.md
          fi
          cat render-lab-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always() && steps.inscope.outputs.any == 'true'
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: render-parity-report
          path: |
            render-lab-out/report.html
            render-lab-out/summary.json
            render-lab-out/summary.md
            render-lab-out/scorecard.json
            render-lab-out/pixel-scoreboard.md
            render-lab-out/pixel-*.json
            render-lab-out/baseline.proposed.json
            render-lab-out/*/*/*.png
            render-lab-out/*/*/lo-*.txt
            render-lab-out/*/*/*.log
          retention-days: 14

      # The sticky comment's text, posted by `report-post`, which runs none
      # of this pull request's code.
      - name: PR comment body
        if: always() && github.event_name == 'pull_request'
        env:
          REPORT: ${{ steps.upload.outputs.artifact-url }}
          ANY: ${{ steps.inscope.outputs.any }}
        run: |
          [ -f render-lab-out/summary.md ] || exit 0
          mkdir -p comment
          { echo '<!-- render-parity-comment -->'; cat render-lab-out/summary.md
            if [ "$ANY" = true ]; then
              echo; echo "Side-by-side report (LibreOffice | ours | diff), with \`baseline.proposed.json\`: ${REPORT}"
            fi; } > comment/comment.md

      - name: Upload PR comment body
        if: always() && github.event_name == 'pull_request' && hashFiles('comment/comment.md') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: render-parity-comment
          path: comment/comment.md
          retention-days: 1

      # The verdict for the labs as well as the comparison: the lab jobs are
      # only started for the apps in scope, so this check, which reports on
      # every pull request, is the one that fails when one of them did.
      - name: Every lab in scope succeeded
        if: always() && steps.inscope.outputs.any == 'true'
        env:
          LAB: ${{ needs.lab.result }}
        run: |
          if [ "$LAB" != success ]; then
            echo "::error::a Render lab job in scope ended '$LAB'; see its log"
            exit 1
          fi

  # Posts what `report` found, with the write token that job does
  # not get (#1678). On a pull request it runs none of the pull request's
  # code: no checkout, only the comment text `report` uploaded. On
  # main it checks out main, which is trusted, for the publishing scripts.
  report-post:
    name: Post the render parity report
    needs: [lab, report]
    if: >-
      ${{ !cancelled() && needs.report.result != 'skipped' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download the comment text
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: render-parity-comment
          path: comment

      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && hashFiles('comment/comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ANY: ${{ needs.report.outputs.any }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- render-parity-comment -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment/comment.md >/dev/null
          elif [ "$ANY" = true ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment/comment.md >/dev/null
          fi
          # Rendered nothing and never commented: nothing to say.

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
        if: github.event_name != 'pull_request' && needs.report.outputs.any == 'true'

      - name: Download the report
        if: github.event_name != 'pull_request' && needs.report.outputs.any == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: render-parity-report
          path: render-lab-out

      # The ranked pixel scoreboard in its pinned issue: the queue to fix
      # from the top of. Only from main, and only from a run that rendered
      # every app, so the board is never a partial list.
      - name: Publish the pixel scoreboard
        if: github.event_name != 'pull_request' && needs.report.outputs.any == 'true' && needs.report.outputs.skipped == '' && hashFiles('render-lab-out/pixel-scores.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 tools/render-lab/pixel_board.py publish
          render-lab-out/pixel-scoreboard.md render-lab-out/pixel-scores.json
          --key fixtures --title "Pixel scoreboard: fixtures"
          --repo "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Sync render-parity issues
        if: github.event_name != 'pull_request' && needs.lab.result == 'success' && hashFiles('render-lab-out/summary.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 tools/render-lab/sync_issues.py render-lab-out/summary.json
          --repo "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # Export parity (docs/EXPORT-PARITY-SPEC.md): each app's own PDF export of
  # the opted-in fixtures (`export: true` in the manifest, docx/pptx only)
  # rasterized like the LibreOffice reference and scored with the same
  # metrics. Same shape as the screenshot jobs above: one lab job per app in
  # scope, then a combine job with the proposed baseline, a sticky PR comment
  # and issue sync on main. The verdicts ratchet against the SEPARATE
  # tools/render-lab/baseline-export.json, never baseline.json.
  export-lab:
    name: Export lab (${{ matrix.app }})
    needs: scope
    if: needs.scope.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Every app the scope reaches, and all three outside a pull request.
        # Tables has had an --export-pdf hook since 17eac2b and its fixtures
        # are opted in, but it was once missing here: its baseline verdicts
        # came from local runs and nothing in CI exported a Tables PDF, so
        # the issue sync filed every one of them as "missing" (#1194).
        app: ${{ fromJSON(needs.scope.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build render-lab image
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab
          cache-to: type=gha,mode=max,scope=render-lab

      - name: Cache cargo
        uses: actions/cache@v6.1.0  # zizmor: ignore[cache-poisoning] false positive: the build-push-action step only loads the render-lab image into the local docker with load: true and publishes nothing
        with:
          path: |
            ~/.cache/render-lab-cargo
            target
          key: render-lab-export-cargo-${{ matrix.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            render-lab-export-cargo-${{ matrix.app }}-
            render-lab-cargo-${{ matrix.app }}-
            render-lab-cargo-

      - name: Run export lab
        env:
          CONTAINER_ENGINE: docker
          APP: ${{ matrix.app }}
        run: tools/render-lab/run-export.sh --app "$APP"

      - name: Upload export captures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: export-lab-${{ matrix.app }}
          path: |
            render-lab-out/${{ matrix.app }}/*/ours-*.png
            render-lab-out/${{ matrix.app }}/*/lo-*.png
            render-lab-out/${{ matrix.app }}/*/lo-*.txt
            render-lab-out/${{ matrix.app }}/*/export.pdf
            render-lab-out/${{ matrix.app }}/*/export.log
          retention-days: 14

  export-report:
    name: Export PDF vs LibreOffice PDF
    needs: [scope, export-lab]
    # Not on a cancelled run: a newer push cancels the labs part-way, and
    # comparing what they had captured by then reported every fixture they
    # never reached as a regression to "missing" (PR #1222, 19 Letters
    # fixtures). A lab that *failed* is still compared and reported, and
    # then fails this job too, as in `report` above.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read-only, as `report` (#1678); `export-report-post` posts.
    permissions:
      contents: read
    outputs:
      any: ${{ steps.inscope.outputs.any }}
    steps:
      - name: Apps in scope
        id: inscope
        env:
          SCOPE: ${{ needs.scope.result }}
          APPS: ${{ needs.scope.outputs.apps }}
        run: |
          if [ "$SCOPE" != success ]; then
            echo "::error::the scope job ended '$SCOPE', so no app's export was judged"
            exit 1
          fi
          {
            for app in letters tables decks; do
              echo "$app=$(jq -c --arg app "$app" 'index($app) != null' <<<"$APPS")"
            done
            echo "any=$(jq -c 'length > 0' <<<"$APPS")"
            echo "args=$(jq -r 'map("--app " + .) | join(" ")' <<<"$APPS")"
            echo "skipped=$(jq -r '["letters", "tables", "decks"] - . | join(", ")' <<<"$APPS")"
          } | tee -a "$GITHUB_OUTPUT"
          if [ "$(jq length <<<"$APPS")" -eq 0 ]; then
            mkdir -p render-lab-out
            { echo "## Export parity: our PDF vs LibreOffice PDF"; echo
              echo "Nothing this pull request changes reaches an app's rendering (tools/render-lab/real_scope.py), so no fixture was exported: every app would export as on main."
            } > render-lab-out/summary-export.md
          fi

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
        if: steps.inscope.outputs.any == 'true'

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.inscope.outputs.any == 'true'

      - name: Build render-lab image
        if: steps.inscope.outputs.any == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools/render-lab
          file: tools/render-lab/Containerfile
          load: true
          tags: render-lab
          build-args: BASE=ghcr.io/${{ github.repository }}/gui-test:main
          cache-from: type=gha,scope=render-lab

      - name: Download export captures (letters)
        if: steps.inscope.outputs.letters == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: export-lab-letters
          path: render-lab-out/letters

      - name: Download export captures (decks)
        if: steps.inscope.outputs.decks == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: export-lab-decks
          path: render-lab-out/decks

      - name: Download export captures (tables)
        if: steps.inscope.outputs.tables == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: export-lab-tables
          path: render-lab-out/tables

      - name: Check every app's export captures arrived
        if: steps.inscope.outputs.any == 'true'
        env:
          APPS: ${{ needs.scope.outputs.apps }}
        run: |
          mkdir -p render-lab-out
          ls render-lab-out
          for app in $(jq -r '.[]' <<<"$APPS"); do
            n=$(find "render-lab-out/$app" -name 'ours-*.png' 2>/dev/null | wc -l)
            echo "$app: $n export captures"
            [ "$n" -gt 0 ] || echo "::warning::no export captures for $app; its export-lab job did not upload, so it is missing from this report"
          done

      # The export verdicts this run would lock in (merged, so the apps out
      # of scope keep their committed verdicts): an agent or reviewer takes
      # `baseline-export.proposed.json` from the artifact instead of
      # re-running the lab locally — after looking at the images.
      - name: Compare exports
        if: steps.inscope.outputs.any == 'true'
        id: compare
        env:
          APP_ARGS: ${{ steps.inscope.outputs.args }}
        run: |
          docker run --rm -e APP_ARGS -v "$PWD:/workspace" -w /workspace render-lab bash -c '
            python3 tools/render-lab/fixtures.py render-lab-out/fixtures >/dev/null &&
            cp tools/render-lab/baseline-export.json render-lab-out/baseline-export.proposed.json &&
            python3 tools/render-lab/export_compare.py render-lab-out/fixtures render-lab-out $APP_ARGS \
              --baseline render-lab-out/baseline-export.proposed.json --update-baseline >/dev/null &&
            python3 tools/render-lab/export_compare.py render-lab-out/fixtures render-lab-out $APP_ARGS \
              --baseline tools/render-lab/baseline-export.json'

      - name: Job summary
        if: always()
        env:
          ANY: ${{ steps.inscope.outputs.any }}
          SKIPPED: ${{ steps.inscope.outputs.skipped }}
        run: |
          # The compare step's container wrote render-lab-out as root; the
          # runner's user cannot append to it until it owns it.
          sudo chown -R "$(id -u):$(id -g)" render-lab-out 2>/dev/null || true
          if [ "$ANY" = true ] && [ -n "$SKIPPED" ] && [ -f render-lab-out/summary-export.md ]; then
            { echo; echo "Not exported: $SKIPPED. Nothing this pull request changes reaches them (tools/render-lab/real_scope.py)."; } >> render-lab-out/summary-export.md
          fi
          cat render-lab-out/summary-export.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload export report
        if: always() && steps.inscope.outputs.any == 'true'
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: export-parity-report
          path: |
            render-lab-out/export-report.html
            render-lab-out/summary-export.json
            render-lab-out/summary-export.md
            render-lab-out/scorecard-export.json
            render-lab-out/baseline-export.proposed.json
            render-lab-out/*/*/ours-*.png
            render-lab-out/*/*/lo-*.png
            render-lab-out/*/*/lo-*.txt
            render-lab-out/*/*/diff-export-*.png
            render-lab-out/*/*/export.pdf
            render-lab-out/*/*/export.log
          retention-days: 14

      - name: PR comment body
        if: always() && github.event_name == 'pull_request'
        env:
          REPORT: ${{ steps.upload.outputs.artifact-url }}
          ANY: ${{ steps.inscope.outputs.any }}
        run: |
          [ -f render-lab-out/summary-export.md ] || exit 0
          mkdir -p comment
          { echo '<!-- export-parity-comment -->'; cat render-lab-out/summary-export.md
            if [ "$ANY" = true ]; then
              echo; echo "Side-by-side export report (LibreOffice PDF | our PDF | diff), with \`baseline-export.proposed.json\`: ${REPORT}"
            fi; } > comment/comment.md

      - name: Upload PR comment body
        if: always() && github.event_name == 'pull_request' && hashFiles('comment/comment.md') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: export-parity-comment
          path: comment/comment.md
          retention-days: 1

      - name: Every export lab in scope succeeded
        if: always() && steps.inscope.outputs.any == 'true'
        env:
          LAB: ${{ needs.export-lab.result }}
        run: |
          if [ "$LAB" != success ]; then
            echo "::error::an Export lab job in scope ended '$LAB'; see its log"
            exit 1
          fi

  flatpak:
    name: Flatpak bundle (${{ matrix.app }})
    if: github.event_name == 'schedule' || inputs.vm
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    strategy:
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The image ships its SDK in /var/lib/flatpak, in the image's own
      # layers. When Flathub has a newer SDK, flatpak-builder updates it in
      # place, and on some runners' overlayfs that fails with "Invalid
      # cross-device link" before anything is built. A copy in the
      # container's writable layer updates normally.
      - name: Make the image's Flatpak installation writable
        run: |
          set -euo pipefail
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: ${{ matrix.app }}.flatpak
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          cache-key: render-lab-flatpak-${{ matrix.app }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.app }}
          path: ${{ matrix.app }}.flatpak
          retention-days: 3

  # The last release's bundles, built from its tag, for the upgrade check
  # (#1209): a user upgrading keeps their settings and recovery checkpoints.
  # Releases carry no bundles of their own to download, so they are built
  # here; the cache is keyed on the tag, so a release is built once.
  flatpak-prior:
    name: Prior-release bundle (${{ matrix.app }})
    if: github.event_name == 'schedule' || inputs.vm
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    strategy:
      matrix:
        app: [letters, tables, decks]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        name: The last release's tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git checkout -q "$tag"
          # The release's own metainfo can name an older version (v2.1.0's
          # latest <release> was 1.1.0), so the report names the tag.
          echo "$tag" > prior-tag.txt
          echo "Prior release: $tag"
      # The image ships its SDK in /var/lib/flatpak, in the image's own
      # layers. When Flathub has a newer SDK, flatpak-builder updates it in
      # place, and on some runners' overlayfs that fails with "Invalid
      # cross-device link" before anything is built. A copy in the
      # container's writable layer updates normally.
      - name: Make the image's Flatpak installation writable
        run: |
          set -euo pipefail
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: ${{ matrix.app }}.flatpak
          manifest-path: flatpak/org.tunaos.${{ matrix.app }}.json
          cache-key: render-lab-flatpak-prior-${{ matrix.app }}-${{ steps.tag.outputs.tag }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prior-bundle-${{ matrix.app }}
          path: |
            ${{ matrix.app }}.flatpak
            prior-tag.txt
          retention-days: 3

  vm:
    name: Tier C (Flatpak in a GNOME VM)
    needs: [flatpak, flatpak-prior]
    # A prior release that fails to build leaves the upgrade check
    # unreported (and failing), not the rest of Tier C unrun.
    if: ${{ !cancelled() && needs.flatpak.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Non-gating until Tier C has a fresh week of green nightly runs on main
    # (#1199). Workflow success alone is insufficient: inspect this job
    # and its Compare step, since failures here are currently allowed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils python3-pil

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      # Not fatal when missing: the upgrade check then reports every app
      # unchecked, and the rest of Tier C still runs.
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: prior-bundle-*
          path: prior-bundles
          merge-multiple: true

      - name: Cache prepared guest image
        uses: actions/cache@v6.1.0
        with:
          path: vm-work
          key: render-lab-vm-${{ hashFiles('tools/render-lab/vm/prepare.sh', 'tools/render-lab/vm/user-data') }}

      - name: Prepare guest (first run only)
        run: '[ -f vm-work/guest.qcow2 ] || tools/render-lab/vm/prepare.sh vm-work'

      - name: Fixtures and LibreOffice reference
        run: |
          docker build -t render-lab -f tools/render-lab/Containerfile \
            --build-arg BASE=ghcr.io/${GITHUB_REPOSITORY}/gui-test:main tools/render-lab
          docker run --rm -v "$PWD:/workspace" -w /workspace render-lab bash -c \
            'python3 tools/render-lab/fixtures.py render-lab-out/fixtures && python3 tools/render-lab/lo_render.py render-lab-out/fixtures render-lab-out'
          # The container wrote render-lab-out as root; the VM capture runs
          # as the runner and writes its screenshots there (#1199: the first
          # run to get that far failed on a PermissionError).
          sudo chown -R "$(id -u):$(id -g)" render-lab-out

      - name: Capture in the VM
        run: tools/render-lab/vm/run.sh vm-work bundles render-lab-out/fixtures render-lab-out prior-bundles

      # Preserve the committed baseline; the proposal is review evidence,
      # never an automatic acceptance of regressions.
      - name: Propose Tier C baseline
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace render-lab bash -ec '
            cp tools/render-lab/baseline.json render-lab-out/baseline.proposed.json
            python3 tools/render-lab/compare.py render-lab-out/fixtures render-lab-out \
              --baseline render-lab-out/baseline.proposed.json --update-baseline'

      - name: Compare
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace render-lab \
            python3 tools/render-lab/compare.py render-lab-out/fixtures render-lab-out --baseline tools/render-lab/baseline.json

      # Compare returns nonzero for regressions and stale baselines. Publish
      # its report in a separate step so those failures remain readable.
      - name: Tier C summary
        if: always() && hashFiles('render-lab-out/summary.md') != ''
        run: cat render-lab-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      # The installed Flatpak used the way a desktop uses it (#1209): opened
      # from the file manager, saved through the document portal.
      - name: Installed Flatpak checks
        if: always()
        run: |
          set -o pipefail
          python3 tools/render-lab/installed_check.py render-lab-out/installed.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Upgrading from the last release (#1209): its settings and an
      # interrupted recovery checkpoint carried over to the candidate.
      - name: Upgrade checks
        if: always()
        run: |
          set -o pipefail
          python3 tools/render-lab/upgrade_check.py render-lab-out/upgrade.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload VM report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: render-parity-vm-report
          path: |
            render-lab-out/report.html
            render-lab-out/baseline.proposed.json
            render-lab-out/summary.*
            render-lab-out/*/*/*.png
            render-lab-out/*/*/*.log
            render-lab-out/installed*
            render-lab-out/upgrade*
            vm-work/*.log
          retention-days: 14

  # Posts what `export-report` found, with the write token that job does
  # not get (#1678). On a pull request it runs none of the pull request's
  # code: no checkout, only the comment text `export-report` uploaded. On
  # main it checks out main, which is trusted, for the publishing scripts.
  export-report-post:
    name: Post the export parity report
    needs: [export-lab, export-report]
    if: >-
      ${{ !cancelled() && needs.export-report.result != 'skipped' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download the comment text
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: export-parity-comment
          path: comment

      - name: Sticky PR comment
        if: github.event_name == 'pull_request' && hashFiles('comment/comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ANY: ${{ needs.export-report.outputs.any }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- export-parity-comment -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment/comment.md >/dev/null
          elif [ "$ANY" = true ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment/comment.md >/dev/null
          fi
          # Rendered nothing and never commented: nothing to say.

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
        if: github.event_name != 'pull_request' && needs.export-report.outputs.any == 'true'

      - name: Download the export report
        if: github.event_name != 'pull_request' && needs.export-report.outputs.any == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: export-parity-report
          path: render-lab-out

      - name: Sync export-parity issues
        if: github.event_name != 'pull_request' && needs.export-lab.result == 'success' && hashFiles('render-lab-out/summary-export.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 tools/render-lab/sync_issues.py render-lab-out/summary-export.json --mode export
          --repo "${GITHUB_REPOSITORY}"
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
