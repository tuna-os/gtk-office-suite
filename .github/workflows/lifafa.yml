name: lifafa

# Lifafa, the suite's email client (imported in #1957), has its own cargo
# workspace and Cargo.lock: the root Cargo.toml excludes it because its gtk4
# 0.9 cannot share a lockfile with the suite's gtk4 0.11. Its fork's own
# workflows were not imported, so nothing here built it, ran its tests or
# checked its lockfile against RustSec, although the suite's "Send by Email"
# hands drafts to it (#1956) and it parses untrusted mail for a living (#1986).
#
#   build       `cargo check --all-targets --locked` and `cargo test --locked` in
#               lifafa/. It needs libadwaita 1.7 and WebKitGTK 6.0 at 2.44 or
#               later, which Ubuntu 24.04 does not ship, so it runs in a Fedora 43
#               container. Its few widget tests need a display: Xvfb. Its
#               keyring tests (#2024) need a Secret Service: they are ignored in
#               plain `cargo test` and run in their own step, under their own
#               session bus with an unlocked gnome-keyring.
#   advisories  `cargo deny check advisories licenses` on lifafa/Cargo.lock,
#               against deny.toml (its ignores for this lock are the ones that
#               name lifafa/; its licence policy is shared, with an exception
#               for Lifafa's own AGPL-3.0-or-later), as collab-apps.yml does
#               for collab/Cargo.lock.
on:
  push:
    branches: [main]
    paths:
      - 'lifafa/**'
      # Lifafa links the suite's shared crates (C1).
      - 'suite-common/**'
      - 'suite-common-core/**'
      - 'deny.toml'
      - '.github/workflows/lifafa.yml'
  pull_request:
    paths:
      - 'lifafa/**'
      # Lifafa links the suite's shared crates (C1).
      - 'suite-common/**'
      - 'suite-common-core/**'
      - 'deny.toml'
      - '.github/workflows/lifafa.yml'
  # A new advisory against Lifafa's lock lands with no change in this
  # repository, so the gate also runs on a schedule.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# A newer push to the same ref supersedes the queued or running one.
concurrency:
  group: lifafa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  build:
    name: Lifafa (check, tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: docker.io/library/fedora:43@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5
    steps:
      - name: Install the GTK, libadwaita, WebKitGTK and Poppler development files
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git pkgconf-pkg-config glib2-devel \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel poppler-glib-devel \
            cairo-devel pango-devel openssl-devel dbus-devel gettext \
            xorg-x11-server-Xvfb mesa-dri-drivers \
            dbus-daemon gnome-keyring libsecret
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: lifafa
          shared-key: lifafa
          cache-on-failure: true
      - name: Versions
        run: |
          rustc --version
          cargo --version
          pkg-config --modversion gtk4 libadwaita-1 webkitgtk-6.0 poppler-glib
      # --locked: lifafa/Cargo.lock is the one Lifafa's workspace resolves to.
      - name: cargo check --all-targets --locked
        working-directory: lifafa
        run: cargo check --all-targets --locked
      # GSK_RENDERER=cairo: Xvfb has no GPU, and the widget tests only need
      # GTK and libadwaita to initialise.
      - name: cargo test --locked
        working-directory: lifafa
        env:
          GSK_RENDERER: cairo
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          for _ in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          cargo test --locked --no-fail-fast -- --test-threads=2
      # Items stored the way keyring 3 stores them (account passwords, OAuth
      # tokens, EDS sources, the predecessors' services) must keep being found,
      # and not be written a second time, by whatever keyring crate Lifafa
      # builds with (#2024). The tests seed those items with secret-tool.
      - name: keyring migration tests (gnome-keyring)
        working-directory: lifafa
        run: |
          dbus-run-session -- sh -ec '
            export XDG_DATA_HOME="$(mktemp -d)" XDG_RUNTIME_DIR="$(mktemp -d)"
            printf test | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            sleep 1
            cargo test --locked keyring_migration -- --ignored --test-threads=1
          '

  advisories:
    name: Lifafa RustSec advisory gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The advisories of lifafa/Cargo.lock, against deny.toml (its ignores for
      # this lock are the ones that name lifafa/). The product's own gate is
      # ci.yml's `advisories`; collab/Cargo.lock's is collab-apps.yml's.
      - name: cargo deny check advisories licenses (lifafa/Cargo.lock)
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: lifafa/Cargo.toml
          command: check advisories licenses
          arguments: --all-features --config deny.toml
