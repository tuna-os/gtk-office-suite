[package]
name = "decks-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# GTK-free presentation core: Deck/Slide/SlideObject model, PPTX I/O,
# undo commands. Must never depend on gtk4/cairo/pango — see
# docs/DEVELOPMENT.md layering rule.
[dependencies]
suite-common-core = { path = "../suite-common-core" }
letters-core = { path = "../letters-core" }
zip = "9.0"
quick-xml = "0.42"
# NamedTempFile for extracted images (gh-268): production code writes
# document-embedded images to /tmp, which must not use predictable paths.
tempfile = "3"
# Recovery snapshots (recovery.rs) serialize the canonical deck in every
# build, so `serde`/`serde_json` are ordinary dependencies now, like in
# letters-core — not gated behind a feature. `collab` only adds the Loro
# document layer on top of the model's serialization.
loro = { version = "1.16", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.23"
betteroffice-drawingml = "=0.3.0"

[features]
default = []
collab = ["dep:loro"]

[dev-dependencies]
proptest = "1"

[lib]
name = "decks_core"
path = "src/lib.rs"
