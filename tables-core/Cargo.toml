[package]
name = "tables-core"
version = "0.1.0"
edition = "2021"
description = "GTK-free spreadsheet core: IronCalc-backed engine, sheet model, undo, xlsx/ods/csv I/O, OpenFormula-conformance-tested against LibreOffice Calc"
license = "GPL-3.0-or-later"
repository = "https://github.com/tuna-os/gtk-office-suite"
keywords = ["spreadsheet", "xlsx", "openformula"]

# GTK-free spreadsheet core: engine (IronCalc), sheet model, undo commands,
# file I/O, Typst export. Must never depend on gtk4/libadwaita/cairo — see
# docs/DEVELOPMENT.md layering rule.
[dependencies]
suite-common-core = { path = "../suite-common-core", version = "0.1.0" }
letters-core = { path = "../letters-core", version = "0.1.0" }
suite-export = { path = "../suite-export", version = "0.1.0" }
ironcalc_base = "0.8"
calamine = "0.36"
rust_xlsxwriter = "0.99"
regex = "1"
chrono = "0.4"
zip = "8.0"
# RFC-0001 Phase 2 (feature `collab`, off by default): the workbook as a
# Loro document. None of these is built without the feature.
loro = { version = "1.16", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
# The session transport (RFC-0001 Phase 2): QUIC between two peers,
# addressed by public key, relayed where a direct path fails.
iroh = { version = "1.2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "time", "macros"], optional = true }
data-encoding = { version = "2", optional = true }

[features]
default = []
collab = ["dep:loro", "dep:serde", "dep:serde_json", "dep:iroh", "dep:tokio", "dep:data-encoding"]

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lib]
name = "tables_core"
path = "src/lib.rs"
