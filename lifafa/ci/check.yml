# CI compile check for Lifafa: builds it against the GNOME 50 SDK, the
# libadwaita/WebKitGTK/GTK it ships, and poppler (which the runtime does not),
# as the real Flatpak does, and runs `cargo check` over every target. Lifafa
# needs libadwaita 1.7 or later, which the Ubuntu runners' packages lack, so
# this is the only place it compiles. It installs nothing.
app-id: org.tunaos.lifafa.check
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: true
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/lifafa-check/cargo
    CARGO_INCREMENTAL: '0'
modules:
  - name: popplerdata
    no-autogen: true
    make-install-args:
      - prefix=/app
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DCMAKE_INSTALL_INCLUDEDIR=/app/include
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_LIBOPENJPEG=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.07.0.tar.xz
        sha256: 304832f48f8a47fdca90c6b6d1f684e68f37c10c9a0726f345f4ca9df4ca01e2
  - name: lifafa-check
    buildsystem: simple
    build-commands:
      - cargo check --locked --all-targets
    sources:
      - type: dir
        path: ..
