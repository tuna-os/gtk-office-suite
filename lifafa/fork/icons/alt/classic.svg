<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="small-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="pad-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="inside-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#deddda"/>
      <stop offset="100%" stop-color="#c0bfbc"/>
    </linearGradient>
  </defs>

  <!-- Envelope inside (back), its flap open -->
  <rect x="28" y="58" width="72" height="46" rx="5" fill="url(#inside-grad)" filter="url(#shadow)"/>
  <path d="M 28,63 L 64,40 L 100,63 Z" fill="url(#inside-grad)" opacity="0.9"/>

  <!-- Letter sliding in -->
  <rect x="36" y="26" width="56" height="58" rx="4" fill="url(#paper-grad)" filter="url(#shadow)"/>
  <rect x="44" y="35" width="26" height="6" rx="2" fill="#1c71d8" opacity="0.8"/>
  <rect x="44" y="48" width="40" height="3" rx="1" fill="#babdb6"/>
  <rect x="44" y="56" width="34" height="3" rx="1" fill="#babdb6"/>
  <rect x="44" y="64" width="40" height="3" rx="1" fill="#babdb6"/>

  <!-- Envelope front pocket -->
  <path d="M 28,63 L 64,88 L 100,63 L 100,99 Q 100,104 95,104 L 33,104 Q 28,104 28,99 Z"
        fill="url(#paper-grad)" filter="url(#shadow)"/>
  <path d="M 30,102 L 56,83 M 98,102 L 72,83" stroke="#deddda" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 28,63 L 64,88 L 100,63" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.8"/>

  <!-- Blue seal -->
  <g filter="url(#small-shadow)">
    <circle cx="64" cy="88" r="7" fill="#3584e4"/>
    <circle cx="64" cy="88" r="4.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <path d="M 59,85 A 6,6 0 0,1 66,82" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.45"/>
  </g>
</svg>
