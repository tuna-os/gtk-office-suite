[package]
name = "suite-export"
version = "0.1.0"
edition = "2021"
description = "In-process PDF export via Typst for office documents: compile Typst source to PDF bytes with embedded fonts"
license = "GPL-3.0-or-later"
repository = "https://github.com/tuna-os/gtk-office-suite"
keywords = ["pdf", "typst", "export"]

# Shared PDF export via the Typst library (no external binary — the CLI
# was never bundled in the Flatpaks, so CLI-based export was broken for
# every Flatpak user). Heavy dependency, so it lives in its own crate
# rather than in the core crates.
[dependencies]
# typst-library (pulled in transitively) depends unconditionally on
# hayagriva for #bibliography() support, which depends on citationberg
# 0.7.0 for CSL-style parsing. The published citationberg pins quick-xml
# `^0.38.1`, which resolves the vulnerable 0.38.4 (RUSTSEC-2026-0194/0195,
# fixed only in quick-xml >= 0.41). The workspace therefore patches
# citationberg to third_party/citationberg, the same release built against
# quick-xml 0.41 with no source changes (#225; docs/DEPENDENCIES.md).
typst-as-lib = { version = "0.18", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
suite-common-core = { path = "../suite-common-core" }

[dev-dependencies]
tempfile = "3"

[lib]
name = "suite_export"
path = "src/lib.rs"
